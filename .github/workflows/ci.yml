name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg 7, ONNX Runtime, pkg-config
        # ffmpeg 7.1 as the packaged app (scripts/package-macos.sh).
        run: |
          brew install ffmpeg@7 onnxruntime pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@7)/lib/pkgconfig" >> "$GITHUB_ENV"
      # The toolchain the project is developed with (newer lints can differ).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Smoke test
        run: scripts/smoke.sh
