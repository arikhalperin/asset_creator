  summary:
    text: "Video support. src/video/mod.rs: VideoSource on ffmpeg-next (linked
      libav): opens mp4/mkv/avi/webm/mov, best video stream, frame threading,
      frame numbers from timestamps at the average frame rate, keyframe_at
      (seek, first frame), exact frame(n) (forward decode within 60 frames else
      seek; overshoot back-off; timestamp gaps return the frame still showing;
      past end clamps and corrects the estimated count), next_frame/next_raw;
      RGBA conversion via swscale with the frame's color matrix/range
      (matches  byte for byte, incl. BT.709 and full range); display rotation
      applied with the same transpose/hflip,vflip filter graph as the CLI before
      conversion. src/video/player.rs: Player worker (latest-wins request slot;
      Preview/Exact/Play with real-time pacing and frame dropping;
      Ended/FrameCount/Error events) and Thumbnails worker. src/video/scene.rs:
      64px box downscale, 16-bin RGB histograms, d = (1/6) sum|dh|,
      SceneDetector (threshold, min scene length). src/video/extract.rs:
      ExtractJob (background, progress, cancel delivers nothing) for Every Nth
      and Scene changes. src/frame_set.rs: FrameSet/FrameSetEntry (source path,
      video name, frame, timestamp, PNG-compressed RGBA, thumbnail; ids never
      reused). src/video_ui.rs: VideoTab (fitted frame, info line, thumbnail
      strip with highlight + click seek, timeline: keyframe preview while
      dragging, exact on release; Start/Step/Play/Step/End, Grab Frame, Extract
      Frames...), ExtractDialog, Frame Set panel (grid, click/Cmd/Shift select,
      double-click/Open, Remove, Clear). ui.rs: Tab::Video, Panel::FrameSet
      (next to Asset Library), File > Open accepts videos (Videos filter),
      open_path routes videos to tabs, Space/Left/Right/Home/End when a video
      tab is focused, Cmd+W closes the focused video, grabbed frames open via
      AppState::new_document_from_image ('<stem> frame <N>', 72 DPI, layer
      Background, no path). main.rs gives the app the repaint context at
      startup. Fixtures in tests/fixtures/video (generate.sh; reference PNGs
      from the ffmpeg CLI; lossless FFV1 RGB; rotated; BT.709; scene clip with
      scenes.json cuts 45/85/115/165/200; corrupt file)."
    truncated: false
