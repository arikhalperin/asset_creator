  summary:
    text: "All nine acceptance items pass. cargo test (all suites, incl. 6 video +
      11 video_ui tests), cargo clippy --all-targets -D warnings, and cargo fmt
      --check are clean; release benches pass with wide margins (A9:
      12.8/39.6/0.72 ms vs 60/500/33). Independent probes confirmed byte-exact
      frames vs ffmpeg CLI for 60 non-committed frame/access-order combinations
      across all containers plus an unseen clip, scene detection follows the
      spec formula with large margins, and decoding stays off the UI thread for
      scrubbing/playback. Residual risks are minor UI-thread joins on
      open/close/cancel and ffmpeg-version coupling of the exactness guarantee."
    truncated: false
  risks:
    - text: VideoSource::open (including decoding/validating the first frame) runs
        synchronously on the UI thread in EditorApp::open_video; fast for normal
        files but a slow/huge/network file would stall the UI during open.
      truncated: false
    - text: Closing a video tab drops Player, whose Drop joins the worker thread on
        the UI thread (waits for one in-flight decode, bounded by ~exact-seek
        time); ExtractJob::cancel likewise joins the extraction thread on the UI
        thread.
      truncated: false
    - text: Every-Nth extraction silently skips a target if the decoder returns a
        different frame index (e.g. timestamp gaps), with no user notice.
      truncated: false
    - text: When playback reaches the end while behind schedule, the last frame may
        have been skipped, so the display can show an earlier frame while scrub
        is set to the last frame.
      truncated: false
    - text: Pixel-exactness relies on mirroring ffmpeg CLI behaviour (BICUBIC swscale
        flags, colorspace details, transpose filters); verified against ffmpeg
        7.1.1 CLI only — a different linked ffmpeg version could diverge from
        committed reference PNGs.
      truncated: false
    - text: Thumbnail workers are detached on drop/resize (not joined); rapid window
        resizing can briefly run several thumbnail decoders concurrently.
      truncated: false
  risks_truncated: false
  completed_at: 2026-10-18T15:09:03.207Z
