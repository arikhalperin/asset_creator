acceptance:
  - id: A1
    source: brief.md
    text: "A1: File → Open lists the video formats; each fixture (H.264 .mp4, VP9
      .webm, .mkv, MPEG-4 .avi, .mov) opens in a new center tab named after the
      file, showing frame 0 and an info line (resolution, frame rate, duration,
      current frame number and timecode). A file that cannot be decoded shows an
      error and adds no tab; closing the tab releases the decoder. A clip with
      90° rotation metadata displays and grabs upright."
    result: passed
    reason:
      text: open_file_dialog adds a 'Videos' filter and video::EXTENSIONS to the
        combined filter; open_path routes is_video_path to open_video, which
        adds a center Tab::Video titled with info.name. tests/video.rs
        every_container_opens_with_its_info passes for
        mp4/webm/mkv/avi/mov/rotated/lossless/bt709 (90 frames, 30 fps).
        video_ui tests check frame 0 pixels, info line text ('160 × 120',
        '30.000 fps', 'frame 0 / 90', duration timecode), corrupt.mp4 -> error
        and no tab, close_video drops VideoTab (Player Drop sets quit and joins
        the worker), rotated.mov shows 120 × 160 and grabs upright. Verifier
        independently confirmed rotated.mov frame 50 is byte-identical to ffmpeg
        CLI autorotated output.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Dragging the timeline shows the nearest preceding keyframe while
      dragging and the exact frame at the released position afterwards; the
      frame counter and timecode follow the displayed frame; decoding never
      blocks the UI thread."
    result: passed
    reason:
      text: Timeline slider sends Request::Preview while dragged and Request::Exact on
        drag_stopped/change (video_ui.rs show). Player is a dedicated worker
        thread with a single-slot Mutex+Condvar request (latest wins); VideoTab
        ignores answers whose request != latest; UI thread only polls via
        try_iter. Counter/timecode are drawn from displayed.index (with
        '(keyframe preview)' tag). keyframe_at seeks to keyframe at-or-before
        (test keyframe_preview_is_at_or_before_the_target; UI test
        scrubbing_previews_keyframes_then_shows_the_exact_frame passes).
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Play/Pause (button and Space) plays at the clip's frame rate,
      dropping frames if decoding falls behind, and stops on the last frame;
      Step Back/Forward (buttons and ←/→) move exactly one frame; Start/End
      (buttons and Home/End) jump to the first/last frame."
    result: passed
    reason:
      text: play() in player.rs paces by start + (index-from)/fps, skips conversion of
        frames more than one frame period late, any new request interrupts
        playback, and Event::Ended stops at the last frame. Step uses displayed
        index +/-1 clamped and seeks exactly; Start/End seek 0/last_frame.
        Space/Left/Right/Home/End consumed only when a video tab is focused and
        not typing. UI test transport_buttons_and_shortcuts passes (checks
        reference pixels after End/Step/Start, play/pause, play to end).
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: The thumbnail strip shows evenly spaced thumbnails across the clip,
      filled in on a background thread, marks the current position, and clicking
      a thumbnail seeks to its frame."
    result: passed
    reason:
      text: layout_strip computes evenly spaced targets i*last/(n-1) for as many slots
        as fit the width (cap 64); Thumbnails worker thread opens its own
        VideoSource and sends keyframe thumbnails as they decode; current_slot
        highlights; click calls seek(frame index) (exact). UI test
        thumbnail_strip_fills_in_and_seeks_on_click passes.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Grab Frame opens a new image document with the video's (display)
      dimensions, one layer containing the exact current frame, named `<video
      stem> frame <N>`. Grabbed frames are pixel-exact: identical to the source
      frames for a lossless (FFV1 RGB) fixture, and identical to `ffmpeg
      -pix_fmt rgba` output for that frame for the lossy fixtures — after
      opening, seeking, stepping, and scrubbing."
    result: passed
    reason:
      text: "grab() decodes the exact frame first if a preview is shown;
        new_document_from_image creates a 72 DPI document with one 'Background'
        layer named '<stem> frame <N>', no source_path, existing documents
        untouched. Committed references match byte-for-byte in tests (all 8
        clips, frames 0/17/45/89, in order, after preview, step fwd/back,
        sequential). Independent probe (scratch crate, public VideoSource API)
        vs fresh ffmpeg 7.1.1 '-vf select=eq(n,N) -pix_fmt rgba' PNGs for
        NON-committed frames: clip.mp4 f1/f63, clip.webm f31/f88, rotated.mov
        f50, clip.avi f59, clip.mkv f30, bt709.mp4 f72, clip.mov f2, scenes.mp4
        f120, lossless.mkv f60 — each checked fresh, after scrubbing,
        step-forward, step-back, and sequential: 55/55 identical. A brand-new
        clip not in the repo (mandelbrot 176x100, 25 fps, H.264 -bf 3 -g 45)
        frames 99/0/46/44/77 in random order: 5/5 identical."
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: Extract Frames… offers Every Nth frame (N, default 30) over a frame
      range (default the whole clip); it runs in the background with a progress
      bar and Cancel, and on completion appends frames start, start+N, … to the
      Frame Set (Cancel adds nothing)."
    result: passed
    reason:
      text: ExtractDialog defaults n=30, from=0, to=last_frame; ExtractJob runs on a
        'video-extract' thread with atomic progress and ProgressBar; Cancel sets
        the flag and drops the result (sender skipped when cancelled), dialog
        closed with nothing added; nth_targets = from, from+N, ... <= to. tests
        every_nth_extracts_exact_frames_in_range (17,45,73 pixel-exact) and UI
        extract_every_nth_frame_appends_to_the_frame_set (0,40,80 then appended
        10,15,20) pass; scene test also verifies Cancel adds nothing.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: Scene-change mode (Threshold, default 30 %; Minimum scene length,
      default 10 frames) compares per-frame color histograms and appends the
      first frame and the first frame of every detected scene; on the scene-cut
      test clip it finds exactly the cut frames listed in the fixture file."
    result: passed
    reason:
      text: "scene.rs matches the spec formula: box downscale to <=64 px longer side,
        16 bins/channel normalized, d = (1/6) * sum |h - h_prev| over 48 bins,
        cut when d >= threshold and index >= last_cut + min_scene, From always
        included; defaults 30 % / 10 frames. scenes.mp4 detection equals
        [0,45,85,115,165,200] from scenes.json (unit + UI tests). Not overfit:
        verifier measured per-frame d on scenes.mp4 — cut frames score
        0.56-0.90, the highest non-cut is 0.25 (frame 116, also within min-scene
        of 115), next 0.09, so threshold 0.30 has wide margin."
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: The Frame Set panel shows every extracted frame as a thumbnail
      labelled with video name, frame number, and timecode; double-click (or
      Open) opens a frame as a new image document pixel-identical to Grab Frame
      of that frame; Remove deletes selected frames and Clear empties the set;
      the frames are available in-session through the `FrameSet` API (source
      path, frame index, timestamp, RGBA image)."
    result: passed
    reason:
      text: "frame_set_panel shows thumbnails labelled '<video name> #N' plus timecode
        and a frame count; click/Cmd/Shift selection; double-click or Open ->
        FrameSetAction::Open opens entry.image() (losslessly PNG-stored) as a
        document named like Grab; Remove/Clear implemented; FrameSet API exposes
        source, video_name, frame, timestamp, image(). Panel listed in
        Panel::ALL and default layout. UI test
        frame_set_panel_opens_removes_and_clears passes (Open is pixel-identical
        to lossless_f45 reference and to a second open), unit test round-trips
        the image."
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: On a generated 1920×1080 H.264 30 fps clip with a keyframe every 60
      frames, a release benchmark shows: keyframe preview while scrubbing < 60
      ms per position, exact frame anywhere < 500 ms, and sequential playback
      decoding faster than real time (< 33 ms per frame)."
    result: passed
    reason:
      text: "cargo test --release -- --ignored: bench_scrub_1080p on generated
        1920x1080 H.264 30 fps -g 60 clip: preview worst 12.8 ms (<60), exact
        worst 39.6 ms (<500, includes 59-frames-before-keyframe cases),
        sequential 0.72 ms/frame incl. RGBA conversion (<33). Independent
        verifier bench on a harder 1080p mandelbrot H.264 -g 60 clip: preview
        worst 26.2 ms, exact worst 69.6 ms, sequential 1.11 ms/frame. Other
        release benches pass (transform 3.13 ms, pan/zoom 0.112 ms, filters
        <=39.8 ms)."
      truncated: false
