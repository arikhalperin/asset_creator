  summary:
    text: "Revision after a passing round 5 (user asked to fix a risk found by
      verifier 5: the gap extension collapsed smooth 10-pose series on larger
      sprites, 10 -> 3 poses). group_poses now only extends merging past the
      fixed rule for small sprites (median core under 32 px on the short side,
      SMALL_SPRITE); larger sprites stop at distance 1. New unit test
      smooth_pose_series_on_a_large_sprite_is_not_collapsed ports verifier 5's
      10-pose checker robot (fails on the previous behaviour with 3 poses; now
      >= 8 poses, the only merges being steps 3.0-3.7 % apart, within the stated
      ~4 % limit). Scoreboards unchanged elsewhere: verifier 5 in-scope 211/216
      (5 tracking splits on a 1 px checker at 2.2 px/frame), s3 robot now 8
      poses instead of 3; verifier 4 117/152; verifier 3 167/167; verifier 2
      90/90. Brief A3 and spec state the small-sprite condition. Earlier rounds:
      Repair round 5 (user chose adaptive grouping + a scoped claim after
      verifier 4: 125/135 fair scenarios, failures on ~20 px thin-winged bats at
      crf 23-28; false merges of tiny pose changes listed as risks).
      src/extract/video.rs: distance() in fixed-rule units; group_poses(): tight
      micro-groups (<= 0.4), average-linkage merging up to 1 and further up to
      the first gap >= 1.5x above 1, tiny groups folded; tracks keep all crops,
      poses computed per object (cluster_of) and recomputed after linking;
      colour difference now the worst quadrant (catches partly recoloured
      copies). Scoreboards: verifier 3's 167/167, verifier 2's 90/90; verifier
      4's set 117/152 incl. scenes it classed as flawed/risk; its fair failures
      10 -> 7 runs, all sprites under 32 px (d14/d19 bats 20x14, one d16 chick
      run). Brief A3/A4 and spec now scope the robustness guarantee to sprites
      >= 32 px on the short side and state the limits (smaller sprites best
      effort; pose changes under ~4 % may merge; Review Merge/Discard correct
      both). New unit tests: adaptive_grouping_absorbs_noise_and_keeps_poses,
      partly_recoloured_copies_are_different_appearances. Earlier rounds: Repair
      round 4 (verifier 3: 140/151 own scenarios; fine high-contrast textures
      failed on interior colour 0.12-0.25 under 4:2:0, flat slime hash distance
      up to 12). Changes in src/extract/video.rs: hash is a prefilter (<= 16
      reliable bits); colour compares 3x3-averaged core colours (precomputed per
      crop) at the shape alignment refined +-1 px for texture phase (shape and
      colour alignments separated in compare()). Scoreboards: verifier 3's 167
      scenarios 167/167, verifier 2's 90/90, verifier 1's clips correct. New
      fixture tests/fixtures/video/textured.mp4 (2 px black/white stripes,
      5-pose figure + striped crate, 1.3 px/frame, crf 28) with test
      fine_textures_under_heavy_compression_keep_the_pose_count. Brief A3 and
      spec updated. Earlier rounds: Repair round 3 (verifier 2 failed A3/A4:
      loop poses split at crf 23-28 with thin limbs and sub-pixel motion; fringe
      specks shifted crop corners by 4 px). Comparison now uses each crop's core
      (largest 8-connected piece + pieces >= 10 % of it), aligns cores by
      bounding-box centre with a +-2 px search, gates core size by max(3 px, 12
      %), shape mismatch <= 4 % (distinct poses measured >= 0.10 on all clips,
      compressed duplicates ~0.02), interior colour <= 12 %; shape and colour
      computed together at the best-shape alignment (compare()). Verifier 2's
      own scoreboard (90 scenarios: 6 scenes x crf 18/23/28 x ranges/every) went
      from 54/90 to 90/90; verifier 1's clips correct. New fixture
      tests/fixtures/video/moving.mp4 (sub-pixel 1.5 px/frame, crf 28) with test
      heavy_compression_and_subpixel_motion_keep_the_pose_count (every 1/2/3).
      Removed the stray tests/fixtures/video/libsave/ left by a verifier probe.
      Brief A3 and spec updated. Earlier rounds: Repair round 2 (verifier failed
      A3/A4 on H.264 probes: flat symmetric static shapes split at keyframes;
      thin limbs doubled poses). New same-appearance rule in
      src/extract/video.rs: PHash with a reliable-bit mask (|coef-median| > 0.25
      x mean abs deviation; distance counts only bits reliable in both), size
      +-3 px, edge-tolerant shape mismatch (opaque pixels with no opaque pixel
      within 1 px in the other, best +-1 alignment, <= 2 %, dilated masks
      precomputed per crop), interior colour difference (<= 8 %, edges
      excluded). Probe results: verifier clips clip_a/clip_a14/clip_b/lossless
      -> 3 singles + exactly 4 (or 6) poses at every 1 and 2; walk unchanged.
      New fixture tests/fixtures/video/shapes.mp4 (crf 18; flat
      disc/square/diamond + thin 4-pose figure) and test
      compressed_flat_shapes_and_thin_limbs_dedup_correctly. Also:
      VideoExtractJob::cancel no longer joins the worker on the UI thread; Save
      PNG... on an animation never overwrites an existing sequence
      (free_entry_path adds ' (2)'). Brief A3 and spec updated to the new rule.
      Previous round: Whole-video extraction. src/extract/video.rs: phash (32x32
      grayscale over neutral gray, separable DCT, 8x8 low frequencies vs
      median), pixel_difference (alpha-weighted mean, best alignment within +-1
      px over the union area), same_appearance (<=8 bits, <=3 px size, <=4 %),
      detect_frame (auto keying, specks <5 px removed, Auto-Detect, tight
      crops), cluster (greedy nearest tracking between consecutive processed
      frames with overlap/reach, histogram <=0.35 and 0.5-2 size ratio;
      appearance dedup per object; linking of objects sharing an appearance;
      poses by first frame), Cluster::merge, align_frames (shared canvas,
      centered, bottom-aligned), VideoExtractJob/run (sequential exact decode,
      Every N with seeks above 30, progress, cancel). src/review_ui.rs:
      VideoAssetsDialog (From/To, Every N, Minimum Size, Merge Distance,
      progress, Cancel), ReviewTab (rows with Keep checkbox, thumbnail or
      filmstrip, counts, first frame; click/Cmd/Shift selection; Merge; Add Kept
      to Library). src/asset_library.rs: animation entries (frames,
      add_animation '<stem> animation <n>', entry_paths/save_entry numbered
      sequences, save_all handles both, no overwrites). app_state:
      new_document_from_frames (one layer per frame, Frame 1 at the bottom).
      ui.rs: Tab::Review, Extract Assets... on the video tab, dialog/pump/review
      wiring, animations in Open/Save; Asset Library rows show a filmstrip and
      'P frames, W x H'. Fixture: tests/fixtures/video/walk.mp4 generated by
      tests/video_extract_fixtures.rs (asserts the 8 poses differ >= 6 %). Brief
      A2/A3 and spec updated (size slack 3 px, +-1 px alignment, speck removal)
      after the walk clip showed sub-pixel width jitter and compression specks."
    truncated: false
