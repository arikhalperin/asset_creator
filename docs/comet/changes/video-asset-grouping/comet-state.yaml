acceptance:
  - id: A1
    source: brief.md
    text: "A1: A video tab's Extract Assets… opens a dialog — From/To frame (default
      the whole clip), Every N frames (default 1), Minimum Size (16 px²), Merge
      Distance (2 px); Extract runs in the background with a progress bar and
      Cancel (Cancel discards everything) and, when done, opens a Review tab
      titled `<video> review`; the UI stays responsive throughout."
    result: passed
    reason:
      text: "Extract Assets… button on the video tab (video_ui.rs) opens
        VideoAssetsDialog: From 0/To last frame, Every N 1 (1-1000), Min Size 16
        px², Merge Distance 2 px; VideoExtractJob runs on a
        'video-extract-assets' worker thread with progress bar and Cancel
        (result dropped when cancelled); on completion a center tab '<video>
        review' opens. Headless tests video_extract_ui (3/3) cover defaults,
        progress/Cancel, tab title."
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Each processed frame is keyed with the automatic background color and
      default tolerance/softness (contiguous), keyed specks of fewer than 5
      pixels (compression noise) are removed, and the frame is split into
      objects with Auto-Detect; every detection is a tight transparent crop
      recorded with its frame number and position."
    result: passed
    reason:
      text: "detect_frame: KeyParams::auto keying, 8-connected keyed pieces < 5 px
        removed, then detect::detect with dialog params; each detection a tight
        crop (tight_crop_region) with frame number and image rect. Covered by
        fixture tests and my probe (every crop attributed to its rendered object
        in all passing runs)."
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Repeated appearances are deduplicated, robustly under video
      compression for sprites whose main shape is at least 32 px on its short
      side (tested with H.264 at crf 18–28, thin limbs, fine textures, and
      sub-pixel motion): crops are compared by their cores (the main piece plus
      pieces at least 10 % of its size, so compression specks are ignored) — a
      perceptual-hash prefilter (≤ 16 reliable bits), core sizes within 3 px or
      12 %, shape mismatch (core pixels with no core pixel within 1 px in the
      other, best alignment with centres matched ±2 px) up to 4 %, and
      3×3-averaged colour differences up to 12 % in every quadrant (compared in
      phase, ±1 px) — and each object's crops are grouped adaptively (tight
      micro-groups merged by average linkage up to that rule; for sprites under
      32 px, further when the object's own distances show a clear gap above it —
      larger sprites keep the rule, so a smooth series of poses each just above
      it is never collapsed). A static object seen in 200 frames yields one
      appearance, and a looping pose is not split by sub-pixel position,
      texture, or compression. Limits (stated, not guaranteed): sprites under 32
      px may still get an extra pose under heavy compression, and poses that
      differ by less than about 4 % of the sprite's pixels may be merged — both
      correctable in the Review tab."
    result: passed
    reason:
      text: "Rule implemented as specified (hash prefilter ≤16 reliable bits, core
        size 3 px/12 %, shape ≤4 % at centre ±2 px, 3×3 colour ≤12 % per
        quadrant ±1 px; average-linkage grouping, gap extension only when median
        core short side < 32). New independent probe (render-level ground truth,
        crf 18/23/28, keyint 12-250, Every 1-4, sub-ranges): in-scope sprites
        (core ≥32 px, poses ≥5 % apart) 240/240 lossy runs exact; near-limit
        (poses 4.1-4.8 % apart, incl. 1.6x robot that previously collapsed to 3
        poses) 96/96 exact; no compression pose split in any of 504 lossy runs.
        Fixture tests shapes/moving/textured pass."
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Detections are linked into objects by tracking between consecutive
      processed frames (overlapping or nearby boxes, similar colors, similar
      size) and by shared appearances; an object with one distinct appearance
      becomes a single-asset cluster, one with several becomes an animation
      cluster whose poses are ordered by first appearance in the video, with
      repeats of a looping animation collapsed (within A3's scope and limits);
      distinct objects, including copies recoloured in one area, stay separate."
    result: passed
    reason:
      text: "Tracking + linking per spec; poses ordered by first appearance and loop
        repeats collapsed in every in-scope run (ORDER/FRAMES/OBJSPLIT never
        flagged in scope); similar-coloured gear crossing a 40 px arm stays
        separate (24/24), quadrant-recoloured static copies of gears (6 sizes)
        and pac-man stay separate. Only object merge seen: a static sprite
        identical to one animation pose is linked into that animation, which the
        spec's shared-appearance linking prescribes."
      truncated: false
  - id: A5
    source: brief.md
    text: 'A5: The Review tab lists clusters (single: thumbnail, "seen in N frames";
      animation: filmstrip of its poses, "P poses, seen in N frames"), each with
      Keep (default) / Discard; Merge combines two or more selected rows into
      one animation (poses deduplicated and ordered by first appearance); Add
      Kept to Library adds kept clusters and closes the tab; discarded clusters
      are not added.'
    result: passed
    reason:
      text: "ReviewTab: single rows 'Single: seen in N frames' + thumbnail, animation
        rows filmstrip + 'Animation: P poses, seen in N frames', Keep default
        on, click/Cmd/Shift selection, Merge (≥2 rows) via Cluster::merge (dedup
        + first-appearance order), Add Kept to Library adds kept only and closes
        the tab; tests discard_and_merge_in_the_review_tab and
        cancel_or_closing_the_review_discards_the_run pass."
      truncated: false
  - id: A6
    source: brief.md
    text: 'A6: Animation entries in the Asset Library show a filmstrip thumbnail,
      the name `<video stem> animation <n>`, and the frame count; their frames
      share one size (the largest pose; each pose bottom-centre aligned); Save
      PNG… writes `<name>_01.png`, `<name>_02.png`, … , Save All writes the
      sequences too, Open as Document opens one layer per frame ("Frame 1", …);
      the `AssetLibrary` API exposes the frames.'
    result: passed
    reason:
      text: add_animation names '<stem> animation <n>', align_frames gives shared
        largest canvas bottom-centred; library row shows filmstrip and 'P
        frames, W × H'; Save PNG writes <name>_01.png… (2+ digits), Save All
        writes sequences, Open as Document gives one layer per frame 'Frame 1'
        at bottom; Asset::is_animation/all_frames/frames API. Unit + UI tests
        pass.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: On the fixture clip (200 frames: a skeleton looping an 8-pose walk
      while moving across a flat background, and a static potion), Extract
      Assets… with default settings and Add Kept to Library yields exactly one
      single potion asset and one 8-frame skeleton animation whose frames are
      the walk's poses in order."
    result: passed
    reason:
      text: "walk.mp4 with defaults: exactly one potion (seen in 200 frames) and one
        8-pose skeleton animation in walk order (tests
        walk_clip_yields_one_potion_and_one_eight_pose_walk and
        extract_assets_review_and_add_yield_one_potion_and_one_walk pass)."
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: In a release build the fixture clip is processed in under 10 s."
    result: passed
    reason:
      text: "Release bench_video_extraction: 0.84 s and 1.07-1.39 s on reruns, 5.76 s
        worst under host load average ~100; always < 10 s."
      truncated: false
