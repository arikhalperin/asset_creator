acceptance:
  - id: A1
    source: brief.md
    text: "A1: The library lives in the app's data folder (`library/` with
      `assets/*.png` and `library.json`); every add, edit, and removal is
      written immediately (atomically); at startup it is loaded, so assets,
      animations, names, categories, tags, and metadata (source file, frame,
      source rectangle, extraction method and parameters, created time) survive
      an app restart pixel-identically; missing or damaged files are skipped
      with a notice, never crashing or losing the rest."
    result: passed
    reason:
      text: "AssetLibrary::open/persist (src/asset_library.rs): library/ with
        assets/<id>.png|<id>_NN.png and library.json; every mutation calls
        persist() via tmp+rename; PNGs written atomically before metadata. Tests
        library_survives_a_restart_with_all_metadata,
        the_library_persists_across_app_restarts and damaged_* pass. Round-2
        risk (a) independently probed: a garbage single PNG plus a missing
        animation frame are skipped with 2 notices; after add, rename, tags,
        set_category, add/rename/remove category, and two removes, both broken
        entries are still in library.json byte-identical to before, their files
        are untouched, new ids never reuse theirs, no .tmp files remain; after
        repairing the files a reopen restores both with all metadata and
        pixels."
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: The dockable Asset Library panel shows a thumbnail grid (adjustable
      size) with name and category, a search box (case-insensitive match on
      name, tags, category, source file), category filter chips with counts
      (multi-select plus All), click/Cmd/Shift selection, and actions: Rename,
      Category (menu), Tags (edit), Remove (asks first), Open as Document,
      Reveal in Finder, Export…, Auto-Tag."
    result: passed
    reason:
      text: "library_ui.rs library_panel: count, search (Asset::matches:
        name/tags/category/source doc/source file name, case-insensitive),
        thumbnail slider 40-128, Export..., Auto-Tag, Categories..., chips
        All+each with counts (multi-select), Rename/Category menu/Tags.../Open
        as Document/Reveal in Finder/Remove... (confirmation window),
        click/Cmd/Shift selection, panel in the dock (Panel::AssetLibrary).
        panel_lists_filters_searches_and_edits and
        panel_content_wraps_inside_the_panel pass."
      truncated: false
  - id: A3
    source: brief.md
    text: 'A3: Categories are editable in the panel: add, rename, and remove (assets
      of a removed category become "other"; "other" cannot be removed); category
      changes are persisted.'
    result: passed
    reason:
      text: "add_category/rename_category/remove_category: removed category assets ->
        other (source none), other cannot be removed or renamed, every change
        persisted; Categories window offers Add/Rename/Remove (no buttons for
        other). Covered by removing_assets_and_categories_updates_disk and the
        panel test; reopened library keeps the category list."
      truncated: false
  - id: A4
    source: brief.md
    text: 'A4: Auto-tagging uses OpenCLIP ViT-B/32 (LAION-2B, MIT, int8, about 155
      MB) via ONNX Runtime, loaded lazily; the first auto-tag asks before
      downloading (SHA-256 checked, background with progress); when available,
      each new asset is tagged in the background with its best category and
      confidence; Auto-Tag re-tags the selection; a category set by hand is
      marked manual and never overwritten by automatic tagging; without the
      model, new assets get "other" and the panel says why.'
    result: passed
    reason:
      text: "tagger.rs: OpenCLIP ViT-B/32 LAION-2B int8 (model_int8.onnx 152.7 MB +
        tokenizer, SHA-256 pinned in models::CLIP), dynamic ONNX Runtime, worker
        created only on the first request; consent window before download,
        Download::start_set in background with progress and hash check (damaged
        download refused in test); new assets queued automatically; Auto-Tag
        forces; apply_auto_tag never overrides Manual unless forced; without
        model panel shows 'Auto-tag off - ...' and assets stay other. Round-2
        risk (c) probed in main.rs's order (open_library then set_tag_config):
        no model -> no tagger, no consent; model files present but ONNX Runtime
        missing -> Unavailable, no consent; model installed -> all 5 untagged
        restored assets become Auto at startup, persisted, and a Manual asset
        stays manual while a new untagged one is tagged."
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: On the labeled fixture set (CC0 Kenney sprites, at least 3 per
      default category, `labels.json`), auto-tagging is at least 70 % correct
      (top-1) on the held-out half (prompt phrases tuned only on the other
      half), and every tag can be corrected manually (UI test)."
    result: passed
    reason:
      text: "tests/fixtures/tagging: 46 CC0 Kenney sprites, >=4 per default category,
        labels.json with tune/test split, LICENSE.txt. Held-out accuracy ran
        with the real model: 18/22 = 82 % (>= 70 %). Manual correction: my probe
        clicked the asset, the Category menu button and the 'potion' item in the
        rendered panel; category became potion/Manual and persisted."
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: Export… writes single assets or the selection as PNGs (unique names),
      or a sprite sheet: Layout Grid (columns automatic or fixed, cells of the
      largest size) or Max-Rects (best-short-side-fit), Padding (default 2 px),
      Power-of-two size (optional), Max size 4096 (error if it does not fit), as
      `<name>.png` plus a TexturePacker JSON Hash `<name>.json`; a test verifies
      every atlas frame rectangle is in bounds, non-overlapping (with padding),
      and pixel-identical to its asset."
    result: passed
    reason:
      text: "pack.rs: Grid (auto ceil(sqrt n) or fixed columns, largest cell),
        Max-Rects BSSF growing bin, padding default 2 (dialog 0-16),
        power-of-two option, max 4096 error, writes <name>.png + TexturePacker
        JSON Hash. sprite_sheet_atlas_coordinates_match_the_assets verifies
        bounds, non-overlap with padding and pixel identity. Round-2 risk (b)
        probed with 3 singles named 'hero', 2 animations named 'hero', and
        singles 'hero_01', 'hero (2)', 'hero (2)_01', 'Hero': for MaxRects/Grid
        auto/Grid 3 with padding 0 and 2 every one of 13 frames has a unique key
        and every source frame is cut pixel-identically exactly once; PNG export
        twice into one folder writes 2x13 distinct files, each pixel-identical
        to its asset frame, nothing overwritten."
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: Animations export as a horizontal strip (PNG plus JSON Hash with its
      frames and an `animations` entry listing them in order) or as numbered
      PNGs (`name_01.png`, …); in a sprite sheet an animation contributes its
      frames and an `animations` entry."
    result: passed
    reason:
      text: "strip() packs an animation left-to-right with an animations entry; Pngs
        writes <name>_01.png...; sheets list animation frames under animations.
        animations_export_as_strips_or_numbered_pngs passes. Probe: Strips twice
        and then PNGs into the same folder with colliding names -> no path
        written twice, expected counts (31 PNG, 4 JSON), each strip JSON
        references its own PNG and its animation frames cut in order equal the
        animation's frames."
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: A library of 1,000 assets loads in under 2 s and the panel stays
      responsive (thumbnails created lazily); tagging one asset takes under 1 s
      in a release build once the model is loaded."
    result: passed
    reason:
      text: "Release: repo bench load 1000 assets 0.12 s, tagging 13 ms/asset after
        warm-up. Probe (release) opening a 1000-asset library through EditorApp
        0.11 s; panel frames 2.4-5.8 ms after a 12 ms first frame (textures
        built on first display, not at load)."
      truncated: false
builder_handoff:
  candidate_id: 568015fd-001a-406f-a0cc-72102182c136
  identity_provider: skill-coordinated
  builder_execution_ref: skill-coordinated:builder:79a9bd21-7d60-44e7-992b-bbddd5a4fa6e
  iteration: 2
  summary:
    text: "Round 2 (user-requested fixes to three verifier risks; round-1 content
      unchanged otherwise). (1) asset_library.rs: entries that fail to load are
      kept in AssetLibrary.broken and written back unchanged by every later
      save; next_id accounts for their ids; their files are never touched, so
      repairing the file restores the asset with all metadata. (2)
      library/pack.rs: frames_of gives every atlas frame and animation a unique
      name (' (2)', ' (3)', ... on collision, also a single named like an
      animation frame), so sprite sheets no longer reject or overwrite
      same-named assets; Strips/PNG-per-asset export picks a free base name
      against existing files and files written in the same export, so nothing is
      overwritten. (3) ui.rs: open_library and set_tag_config queue untagged
      assets when tagging is enabled and the CLIP model is already installed (no
      consent prompt or worker at startup otherwise), so assets left untagged by
      an earlier session are tagged after restart. Round 1 summary: Asset
      library. src/asset_library.rs: persistent AssetLibrary (open(dir):
      assets/<id>.png or <id>_NN.png plus library.json with categories, next_id,
      name counters, and per asset
      kind/files/size/category/category_source/confidence/tags/source{document,\
      file,frame,rect}/extraction{method,params}/created; atomic writes via
      tmp+rename after every change; damaged entries skipped with notices;
      damaged library.json kept as library.json.bad); categories (defaults;
      add/rename/remove, other permanent); manual vs auto category with
      apply_auto_tag never overriding manual unless forced; search matching.
      src/library/pack.rs: grid and max-rects (best-short-side-fit, growing bin)
      packing with padding, power-of-two, max size; TexturePacker JSON Hash
      atlas with frames/animations/meta; strips; export(PNGs | Sheet | Strips).
      src/library/tagger.rs: OpenCLIP ViT-B/32 LAION-2B int8 via dynamic ONNX
      Runtime + tokenizers; cached per-category prompt-ensemble text embeddings;
      image embeds; softmax confidence; background Tagger queue; TagConfig
      (disabled for fresh editors; main enables the default).
      src/extract/models.rs generalized to ModelSets (MobileSAM, CLIP with
      pinned SHA-256; Download::start_set). src/library_ui.rs: panel (count,
      search, thumbnail size, Export, Auto-Tag, Categories, tagging status,
      chips with counts, Rename/Category/Tags/Open/Reveal/Remove, thumbnail grid
      with filmstrip mark and category/auto confidence) wrapping to the panel
      width; windows for rename, tags, remove confirmation, categories, export.
      ui.rs: open_library (main opens AssetLibrary::default_dir, GAC_LIBRARY_DIR
      overrides), origins recorded for
      auto-detect/selection/extract-object/video assets, auto-tag queue for new
      untagged assets, CLIP consent and download, library_action handlers,
      export_assets. Fixture tests/fixtures/tagging: 46 CC0 Kenney sprites (Tiny
      Dungeon, 1-Bit, Roguelike RPG) with labels.json (tune/test split) and
      LICENSE.txt."
    truncated: false
  addressed_acceptance_ids:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    - A8
