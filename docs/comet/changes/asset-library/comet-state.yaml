        sprites (1-bit spikes) are weak (0/2). A few Tiny Dungeon test sprites
        were seen during an early prompt experiment before the split existed;
        the 1-bit and RPG test sprites were not.
      truncated: false
    - text: The tagging model is not in the repo; checks use the copy in the
        scratchpad (same files and SHA-256 as the app downloads). The user's app
        data has no CLIP model yet; the first added asset in the app will ask to
        download.
      truncated: false
    - text: Multi-page atlases, rotation/trimming, other atlas formats, and several
        libraries are non-goals.
      truncated: false
    - text: Reveal in Finder uses  (macOS).
