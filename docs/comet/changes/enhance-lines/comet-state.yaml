  risks:
    - text: "Binary gap closing pads the erosion with foreground at the image border,
        so a line within about g/2 of the enhanced image's edge is smeared out
        to the edge. Confirmed: a line 2 px from the bottom edge at gaps 0.5 mm,
        and 4 px at 1.0 mm, fills every pixel below it to the edge. The app adds
        a margin of 4 mm or more around areas, so this only affects lines at a
        page or document edge (or a selection at the document edge in the
        editor)."
      truncated: false
    - text: Typical stroke width is one global value per enhanced region, so lines of
        different widths in one area widen by the same absolute amount, not each
        by the factor. The fixture is fine because all its lines are 0.25 mm.
      truncated: false
    - text: The 45 deg diagonal sits at the low end of the E4 range (1.67-1.77 at
        2.0x; 1.27 at 1.5x for the diagonal alone).
      truncated: false
    - text: The preview of large areas runs at reduced scale (px_per_mm scaled), so it
        can differ slightly from the full-resolution Apply. Preview timing with
        many pages that have areas was only measured for 2 pages.
      truncated: false
    - text: Results depend on correct DPI. On the low-resolution user example
        (insignia screenshot), processing at 300 dpi turns the insignia into a
        blob. At about 72 dpi it enhances well, but straight panel lines look
        dashed.
      truncated: false
    - text: "The Builder handoff text is partly stale: it mentions dilate_disc, but
        the code now uses an exact Euclidean distance transform."
      truncated: false
