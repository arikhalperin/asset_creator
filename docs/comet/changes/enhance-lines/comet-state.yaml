acceptance:
  - id: A1
    source: brief.md
    text: "E1: On the fixture, with default settings, every faded line (insignia
      outline, flap and panel lines) has at least twice its original lightness
      contrast against the adjacent paint (or reaches L* ≤ 20), and each
      enhanced line pixel keeps its hue (within 15° for lines with chroma > 10)
      — a darker shade of its own colour; at Line strength 0 % lines are
      unchanged."
    result: passed
    reason:
      text: "Independent probe on test_sheet, defaults: all 8741 detected line px with
        chroma>10 keep hue (worst 2.9 deg, none >15). Contrast ratio from
        profile-averaged cuts along all flap lines (every 3 mm) and the ring
        (every 10 deg) is >=2 everywhere except two ring spots at 1.95-1.99,
        where the enhanced line is L* 8.9-9.4 (meets the 'or L* <= 20' branch).
        Strength 0: 0 detected line px changed (gaps 0 and default gaps). Test
        faded_lines_get_twice_the_contrast_and_keep_their_hue passed in the
        2376aceb cargo-test log."
      truncated: false
  - id: A2
    source: brief.md
    text: "E2: Paint is kept: with Smooth grain 0 %, every pixel farther than 1 mm
      from any line is unchanged (ΔE < 1); with Smooth grain 100 %, the grain
      (standard deviation of L* in flat paint) drops by at least half while the
      paint's mean colour moves by less than ΔE 2; light (white) lines on dark
      paint are unchanged (ΔE < 2)."
    result: passed
    reason:
      text: "Smooth 0: 0 px farther than 1 mm from any line (flaps, ring, diagonal)
        with dE>=1. Smooth 100 (thickness 1.0 and 2.0): L* SD in four flat-paint
        patches (light green, dark green, tan x2) drops to 0.16x, mean dE
        0.00-0.01; white line on dark green worst dE 0.00 (centre +/-1 px,
        35.5-54.5 mm). Repo test passed."
      truncated: false
  - id: A3
    source: brief.md
    text: "E3: Close gaps: gaps in a line shorter than the Close gaps setting are
      filled (every point along the line is at least 70 % as dark as the
      enhanced line), and gaps longer than 1.5× the setting stay open; at 0 mm
      no gap is filled."
    result: passed
    reason:
      text: Gap 0.3 mm with 0.5/0.4/1.0/2.0 mm settings is filled (min darkness
        0.87-0.99 of the line). Gap 0.6 mm at 0.7/1.0/2.0 mm is filled at L*
        11-12, the same as the adjacent enhanced line on dark green (an earlier
        0.68 ratio came from comparing with the light-green line, so it was a
        measurement artefact). Gap 1.2 mm stays open at 0.5 mm (and 0.6 mm at
        0.4 mm). At 0 mm no gap is filled (<=0.03). Repo test passed.
      truncated: false
  - id: A4
    source: brief.md
    text: "E4: Thickness 2.0× makes the fixture's lines 1.6–2.4× as wide as at 1.0×
      (measured across the line), and at 1.0× line width changes by at most 1
      px."
    result: passed
    reason:
      text: "Metric: equivalent width = integral across the line of the normalised
        darkness (paint ref 1.0-1.6 mm each side, bilinear, 0.25 px steps), from
        a mean profile over 41 cuts along the line. FWHM is a secondary check.
        Whole fixture (5 flap spots, ring every 15 deg, diagonal at 3 points):
        2.0x/1.0x = 1.67-2.10, 1.5x/1.0x = 1.33-1.52, |w1.0-w0| <= 0.73 px. Ring
        alone (crops with 2 mm and 1 mm margin, every 30 deg): 1.70-2.15, |dw|
        <= 0.80. Diagonal alone: 1.75-1.77. Flap segment alone: 1.99. Isolated
        0.25 mm lines, 10 L* contrast, fixture-style grain, on light green, dark
        green and tan, 8 mm and 20 mm areas, 18 angles from 0 to 165 deg (108
        cases): 1.78-2.16 at 2.0x, 1.35-1.58 at 1.5x, |dw at 1.0x| <= 0.22 px.
        FWHM: 1.67-2.27 for fixture and ring/diagonal, and 2.43-2.45 for a few 2
        px isolated lines, a quantisation artefact (pixel count is exactly
        2->4). The only out-of-range case was a ring crop with just 0.5 mm
        margin, caused by an image-border artefact (see risks); the app always
        adds a margin of 4 mm or more around areas. Repo tests passed
        (thickness_widens_lines, thickness_is_the_same_for_curves_and_diagonals,
        thickness_is_the_same_at_every_angle_for_isolated_lines,
        thickness_holds_for_the_ring_and_diagonal_alone)."
      truncated: false
  - id: A5
    source: brief.md
    text: "E5: Crisp edges: across an enhanced line, the transition from paint to
      line takes at most 2 px at 300 dpi."
    result: passed
    reason:
      text: "Single-pixel columns across the flap lines (41 columns at each of 4
        spots), counting px between 20 % and 80 % of paint->line per side, worst
        case: 0 px at 1.0x, 1 px at 2.0x, 2 px at 1.5x (soft edge <= 1 px). All
        <= 2 px. Repo enhanced_edges_are_crisp passed."
      truncated: false
  - id: A6
    source: brief.md
    text: "E6: Area limit: in the Parts Layout tab, only pixels inside the Enhance
      Lines areas change (outside: byte-identical; pages without areas
      unchanged); the areas are separate from Recolour Area's; rectangle and
      Shift-lasso both work; Clear Areas removes them."
    result: passed
    reason:
      text: "enhance_ui parts_layout_enhance_lines_in_drawn_areas passes in the
        release log and in my own release run with PDFium: rectangle and
        Shift-lasso give 2 enhance_areas, while tab.areas (Recolour) stays
        empty. No pixel changes outside the area boxes, a page without areas is
        byte-identical, and Clear Areas empties the list. Code: enhance() skips
        pixels where allowed==0 (polygon fill) and replace() only writes the
        region crop, so pixels outside the polygon are byte-identical."
      truncated: false
  - id: A7
    source: brief.md
    text: "E7: Parts Layout Enhance Lines…: the preview follows every control change
      within 200 ms (release); Apply runs on a worker with progress and Cancel;
      afterwards parts keep their outlines and placements (no re-pack), Export
      A4 Pages… shows the enhanced lines, and Revert to Original restores the
      PDF render exactly."
    result: passed
    reason:
      text: "My release run: preview frame 33.6 ms after a setting change, and 126 ms
        for whole-page areas on both pages (budget-scaled). Apply runs on a
        worker thread through the shared page job (progress bar, Cancel calls
        cancel_recolor). Placements are unchanged (no re-pack), the A4 export
        differs after Apply, and Revert restores page images exactly (asserted).
        The preview pauses after Apply."
      truncated: false
  - id: A8
    source: brief.md
    text: 'E8: Filter ▸ Enhance Lines… in the editor: limited to the selection
      (pixels outside unchanged), live preview, Cancel restores the layer
      exactly, OK is one undo step "Enhance Lines".'
    result: passed
    reason:
      text: "editor_enhance_lines_filter_on_the_selection passes in release: Filter
        menu has 'Enhance Lines…' with the 4 params, the preview darkens the
        line, Cancel restores the layer exactly, and OK adds 1 undo step
        labelled 'Enhance Lines'. Pixels right of the selection are unchanged.
        with_dpi is applied in the preview, OK and recompute paths. Open Page in
        Editor sets DPI 300."
      truncated: false
  - id: A9
    source: brief.md
    text: "E9: Enhancing a whole A3 page at 300 dpi takes under 3 s (release)."
    result: passed
    reason:
      text: "bench_enhance_a3_page (release, thickness 1.5): 658 ms in the Runtime log
        and 752 ms in my run, both under 3 s."
      truncated: false
builder_handoff:
  candidate_id: 25d26b49-6c55-446f-ab3f-a95b0a67490e
  identity_provider: skill-coordinated
  builder_execution_ref: skill-coordinated:builder:57f8d343-78bb-4c71-8c0f-f636af58c14e
  iteration: 1
  summary:
    text: "Round 4 (A4/E4 fix, isolated lines): thickening is now angle-independent
      end to end: typical stroke width = mask area / length, the length from the
      area a Euclidean dilation adds between radius 2 and 3 px (no
      square-erosion bias); widening by the exact Euclidean distance to the mask
      with fractional coverage of the outermost pixels (<=1 px soft edge), so
      1.5x and diagonals come out right. Tests:
      thickness_is_the_same_at_every_angle_for_isolated_lines (9 angles 0-165
      deg, 1.5x in 1.3-1.75, 2.0x in 1.6-2.4, 1.0x unchanged),
      thickness_holds_for_the_ring_and_diagonal_alone (cropped areas), unit test
      distances_match_brute_force; width measure in tests is darkness-integrated
      across the cut. Own probe with a half-threshold pixel count: 0.25-0.6 mm
      lines give 1.67-2.11x at 2.0x at 0-80 deg, transitions <=2 px. Spec synced
      (thickness wording). thickening now dilates the line mask with a disc
      (dilate_disc: union of row dilations by the disc half-width per dy), so
      curves and diagonals widen like straight lines; the test sheet gained a 45
      deg stroke and tests/enhance.rs
      thickness_is_the_same_for_curves_and_diagonals checks the ring at 8 angles
      (mean of 9 cuts) and the diagonal (1.6-2.4x; 1.0x unchanged); unit test
      disc_dilation_is_round. Also: the enhance preview pauses after Apply (no
      stacking) until a setting/area changes or Revert; spec synced (disc,
      preview pause, fixture ring + diagonal). Round 2 preview fix kept (two
      whole-page areas 127 ms). the Parts Layout enhance preview measured
      574-713 ms for whole-page areas because it always enhanced at full
      resolution before applying the 1.5 Mpx cap. Now region_rect measures the
      area first and the region is enhanced once at a reduced scale (budget 1
      Mpx shared by pages with areas, min 0.25 Mpx), shrunk straight from a page
      view with thumbnail (no full copy). Release: small area 34-45 ms, two
      whole-page areas 127-133 ms (new assertion in tests/enhance_ui.rs). C15
      Enhance Lines (E1-E9). New src/enhance.rs: CIELAB lightness line detection
      (3x3 median when >=10 px/mm, 3x3 mean, grey closing 0.6 mm, own-darkness
      check, despeckle; light lines via opening), darkening by 1-0.85*s on L,a,b
      (hue kept), gap closing (binary closing g/2), thickening by typical stroke
      width, grain smoothing by masked 0.25 mm box mean excluding lines/light
      lines; allowed mask. Editor: Filter > Enhance Lines... (registry, golden
      image, hidden _dpi param from the document DPI; Open Page in Editor now
      sets 300 dpi). Parts Layout: src/parts_ui/enhance.rs window with its own
      areas (rectangle / Shift-lasso, orange outlines, Clear Areas), live
      preview of area crops (reduced scale above 1.5 Mpx), Apply on the shared
      page-job worker (progress, Cancel), no re-pack, Revert to Original;
      opening it closes Recolor... and vice versa. Moved a misplaced C14 doc
      comment back onto recolor_controls. (Runtime IDs A1-A9 = brief E1-E9.)"
    truncated: false
  addressed_acceptance_ids:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    - A8
    - A9
  checks:
    - name:
        text: all-dispatch-checks
        truncated: false
      result: passed
      note:
        text: "c15_all.sh: all 17 exit 0 (enhance A3 635 ms; previews 34 ms / 122 ms)."
        truncated: false
  checks_truncated: false
  known_limits:
    - text: Editor documents from image files without DPI metadata are treated as 72
        dpi, so millimetre settings scale accordingly.
      truncated: false
    - text: Square gap closing can also fill between parallel lines closer than the
        gap setting.
      truncated: false
    - text: Thickness uses one typical stroke width per enhanced region.
      truncated: false
    - text: A 1 px (0.1 mm) break is bridged by the 3x3 median even at Close gaps 0
        (below grain scale).
      truncated: false
    - text: Large-area previews are computed at reduced scale on the UI thread.
      truncated: false
    - text: Strokes under ~2 px (0.15 mm at 300 dpi) widen mostly by sub-pixel
        coverage, so a half-threshold pixel count of their width is coarse
        (1.5-3.4x at 2.0x); darkness-integrated width scales correctly.
      truncated: false
  known_limits_truncated: false
  review: null
  submitted_at: 2026-10-22T10:20:01.940Z
