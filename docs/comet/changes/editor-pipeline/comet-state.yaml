  builder_execution_ref: skill-coordinated:builder:f0dda1a4-9175-41ce-9d57-e09818546856
  iteration: 3
  summary:
    text: "Round 3 (fixes the round-2 A3 defect). Extraction never reads Remove
      Background's preview layer: while the Remove Background dialog is open or
      a preview layer exists, Extract Object prompts (canvas or extract_prompt),
      Accept, To Selection, and Add Selection to Library are refused (status
      message). New test extraction_waits_while_remove_background_is_open (an
      existing mask cannot be accepted, prompts and a real canvas box drag are
      ignored, Add Selection refused, and after Cancel the asset equals the real
      canvas composite pixel for pixel). Round 2 (fixes the review's A1/A3
      defects). The Remove Background (Canvas) preview layer can no longer leak:
      AppState::execute refuses every command while it exists,
      preview_layer_props ignores it, EditorApp::layer_action ignores
      layer-panel/menu actions while it exists (status message), and Save Back
      is disabled/refused (can_save_back: linked and no stroke, transform,
      filter preview, or preview layer). Save Back after the asset was removed
      keeps the asset's kind from when the copy was opened (library_links store
      asset + animation), so an animation copy becomes a new animation with one
      frame per layer. Drops outside the image (grey area) do nothing. set_image
      no longer writes metadata when a version PNG fails to save (previous
      version stays current, partial files removed, notice). New regression
      tests in tests/editor_pipeline.rs:
      save_back_of_a_removed_animation_keeps_its_frames,
      the_remove_background_preview_layer_never_leaks (Save Back disabled +
      refused, Duplicate via layer action and direct execute refused,
      visibility/opacity actions ignored, no undo entries, layers unchanged
      after cancel), drops_outside_the_image_do_nothing,
      a_failed_version_write_keeps_the_current_version. Round 1: Editor ↔
      pipeline loop. asset_library.rs: Asset.version + versions
      (Version{version, created, files, width, height}); set_image() writes
      <id>.v<n>.png / <id>.v<n>_<nn>.png then library.json; version_images()
      (disk, or memory for in-memory libraries); restore_version() (as a new
      version); remove() deletes every version's files; older entries load as
      version 1 with their original file names; clean_up(ids) adds a version
      only for changed assets. cleanup.rs: despeckle (alpha<8 cleared;
      8-connected specks < max(4, 0.1 % of content) removed), content_bounds,
      clean_frames (one union crop for animation frames), clean_document (active
      layer despeckled, canvas cropped to the visible composite). document.rs
      Document::cropped (layers, masks, selection); undo.rs SwapDocument
      (whole-document undo step, keeps name/path). ui.rs: Edit a Copy (library
      Open/double-click) opens '<name> (library)' linked in library_links,
      marked saved; File ▸ Save Back to Library (enabled for linked docs) →
      set_image (composite, or one frame per layer for animations), status,
      mark_saved; removed asset → new asset, relinked; Image ▸ Clean Up (one
      'Clean Up' step); drop_asset (new layer named after the asset above the
      active one, centred, clipped, 'Add Asset Layer' step; animations: first
      frame) via CanvasEvent::DropAsset when an AssetDrag payload is released
      over a canvas. Extraction source: ToolOptions.extract_from_canvas (default
      true); extraction_input() gives composite or active layer + selection;
      Remove Background (Canvas: keyed copy previewed on a temporary layer
      outside the undo history via
      AppState::begin_layer_filter/end_layer_filter, OK = one 'Remove
      Background' step adding 'Background removed'; Cancel leaves no
      layer/undo/redo), Auto-Detect (keys the selected area if it has no
      transparency, clears outside the selection), Extract Object (canvas or
      layer image, mask intersected with the selection, crop from the same
      image) and Add Selection to Library record params source/region; Source
      switch in both windows and in the Extract Object options strip.
      library_ui.rs: Edit a Copy, Versions… window (newest first, thumbnails,
      date, size, Restore), Clean Up button, draggable thumbnails (AssetDrag
      payload, preview follows the pointer), thumbnails keyed by (id, version)
      so they refresh on a new version. Fixture
      tests/fixtures/video/skeleton.mp4 (Kenney CC0 skeleton_01 scaled 2× over
      teal, generate.sh updated)."
    truncated: false
  addressed_acceptance_ids:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
