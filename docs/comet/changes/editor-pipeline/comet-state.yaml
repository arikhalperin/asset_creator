          → layer equals the edited skeleton pixel for pixel). Unit tests in
          cleanup.rs and library_ui.rs (dates). Existing tests updated:
          extract_ui Open now names '(library)'."
        truncated: false
    - name:
        text: clippy -D warnings
        truncated: false
      result: passed
