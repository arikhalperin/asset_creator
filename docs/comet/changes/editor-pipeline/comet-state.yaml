acceptance:
  - id: A1
    source: brief.md
    text: 'A1: Library "Edit a Copy" opens the selected asset as a document titled
      "<asset name> (library)" (animations: one layer per frame); File ▸ Save
      Back to Library (enabled only for such documents) stores the document into
      that asset as version n+1 (single: the visible composite; animation: one
      frame per top-level layer in order), the panel thumbnail and Versions…
      show the new image immediately, and the document is no longer marked
      modified; if the asset was removed, Save Back adds a new asset instead.'
    result: passed
    reason:
      text: Edit a Copy opens '<name> (library)' linked docs (animations one layer per
        frame); File > Save Back is enabled only for linked docs with no live
        edit/preview layer, writes version n+1 (single = visible composite incl.
        hidden-layer handling; animation = one frame per layer), clears the
        modified mark, and the panel thumbnail is keyed by (id, version) so it
        refreshes next frame; Versions... shows the new version. Removed asset
        -> Save Back adds a new asset of the same kind (single and animation,
        via UI menu). Save Back via the File menu during a Remove Background
        preview is refused (version stays 1, image unchanged); after OK it saves
        the real composite as v2. Builder tests + round-1/2 probes + new r3
        probe pass.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Versions are kept on disk and survive restarts; Versions… lists every
      version (number, date, size, thumbnail) and Restore makes the chosen
      version current as a new version; removing the asset deletes all its
      version files; library.json from C10/C11 loads unchanged (assets start at
      version 1)."
    result: passed
    reason:
      text: "Versions stored as assets/<id>.v<n>.png (frames _<nn>), files written via
        atomic PNG save before library.json; failed version write keeps the
        previous version and writes no metadata. Versions survive restart (probe
        re-opened library: 3 versions newest first with date and size), Restore
        creates a new version, Remove deletes every version file (assets dir
        empty). Master/C10/C11 library.json load unchanged as version 1 with
        original file names."
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Remove Background, Auto-Detect Objects, and Extract Object use the
      visible canvas composite by default and only the active selection's area
      when there is one (pixels outside the selection are ignored/transparent,
      results never extend beyond it); each tool has a Source: Canvas / Active
      layer switch; with Canvas, Remove Background adds a new layer \"Background
      removed\"; assets record source \"canvas\" or \"layer\" and the selection
      bounds in their extraction parameters."
    result: passed
    reason:
      text: "Round-2 defect fixed: with Extract Object tool and Remove Background
        (Canvas) open from the Extract menu, a real canvas box drag creates no
        session/request (status 'Finish or cancel Remove Background first'), the
        strip 'Add to Library' button, extract_accept, and To Selection are
        refused, no asset is added; after Cancel the extracted asset equals the
        real composite pixel for pixel (625/625). An in-flight mask arriving
        during the preview cannot be accepted. Auto-Detect, Find Repeating
        Pattern, Add Selection to Library (API and menu) are refused;
        Save/Export refused (live edit) and write no files; Image > Clean Up and
        drops onto the previewing doc are refused; Filter menu (Invert/Gaussian
        Blur) during the preview removes the preview layer first; undo/redo
        traversal and saved .gac never contain the preview layer; 33-case UI
        adversarial sweep (shortcuts, layer menu, layer rows, strokes, tab
        switches, Edit a Copy + Save Back) clean. Functional A3: Canvas is the
        default with a Source switch in all three tools; Canvas RB adds one
        'Background removed' layer above active in one undo step (nothing
        outside selection); Auto-Detect/Extract Object honour the selection (no
        results outside it) and record source canvas|layer and region."
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Dragging a library thumbnail onto a document canvas adds a new layer
      named after the asset above the active layer, centred on the drop point
      (clipped to the canvas), as one undo step; an animation adds its first
      frame; dropping anywhere else does nothing."
    result: passed
    reason:
      text: Dragging a library thumbnail onto a document canvas adds a layer named
        after the asset at active+1, centred on the drop point (verified at
        several zooms), clipped to the canvas, one undo step; animations add
        their first frame; drops on the grey area, the layers panel, or the
        library do nothing.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Clean Up on selected library assets removes stray alpha (alpha < 8
      cleared; 8-connected specks below max(4 px, 0.1 % of content) removed) and
      crops to the remaining content (animations: one crop for all frames),
      saving a new version; Image ▸ Clean Up does the same to the active layer
      and crops the canvas to the visible content as one undo step; already
      clean assets are left unchanged (no new version)."
    result: passed
    reason:
      text: "Despeckle clears alpha<8 and removes 8-connected specks below max(4 px,
        0.1% of content) (threshold boundary probed), then crops; library Clean
        Up adds a version only for changed assets (animations: one union crop
        for all frames); Image > Clean Up despeckles the active layer and crops
        canvas, masks and selection as one undo step (undo/redo restore size and
        pixels)."
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: Full loop (headless UI test on a fixture video of a CC0 skeleton
      sprite): open the video, grab a frame into a document, extract the
      skeleton with Extract Object (or Auto-Detect) into the library, Edit a
      Copy, paint on it, Save Back (version 2, thumbnail updated), create a new
      document, drag the asset onto it — the new layer holds the edited skeleton
      pixel-for-pixel at the drop position."
    result: passed
    reason:
      text: tests/fixtures/video/skeleton.mp4 is H.264 320x240 30 frames generated
        from the CC0 Kenney Tiny Dungeon skeleton (license in
        tests/fixtures/tagging/LICENSE.txt, recipe in generate.sh). Headless
        full_loop_video_to_composition passes (video -> grab frame ->
        Auto-Detect -> library -> Edit a Copy -> paint -> Save Back v2 via File
        menu -> new document -> drag thumbnail -> layer equals edited skeleton
        pixel for pixel at the drop position); an independent Extract Object
        variant of the loop also passes.
      truncated: false
