  risks:
    - text: Extract Object segments the full canvas composite and clips the resulting
        mask to the selection afterwards (output never extends beyond the
        selection, but the segmenter sees context outside it rather than only
        the selection's bounds); the clip uses the selection at result time, so
        changing the selection before Accept is not re-applied.
      truncated: false
    - text: "Filter menu stays enabled while Remove Background is open: opening a
        parameter filter (e.g. Gaussian Blur...) during the preview leaves both
        dialogs open sharing one filter session, and RB OK then silently cancels
        the other filter (no leak, but the blur is lost). Pre-existing
        interaction."
