    text: "Round 3 passes. The round-2 A3 leak is fixed: while Remove Background
      (Canvas) is open, Extract Object prompts/drags, Accept, To Selection, Add
      Selection to Library, Auto-Detect, Find Repeating Pattern, Save, Export,
