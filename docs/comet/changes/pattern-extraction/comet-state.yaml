  builder_execution_ref: skill-coordinated:builder:3b387023-647a-45cb-b394-f3b2c7e1a827
  iteration: 6
  summary:
    text: "Round 3 (user chose: fix both, re-verify). A1: the axis profiles now
      extend one lag past half the extent, and period candidates (≤ half the
      extent, i.e. two repeats) must be peaks with a neighbour on both sides, so
      an end lag on a rising slope (brick_red 318/319 px wide → fake 159×80) is
      no longer taken; the ±1 refinement is limited to the two-repeat range too.
      A3: the manual-crop edge grab zone is at most a quarter of the tile per
      axis (min(8 screen px, size/4)), so small tiles move when dragged from
      inside and still resize from their edges. New tests:
      just_under_two_repeats_is_no_pattern (every fixture at 2t−1, 2t−2 on each
      axis → none, exactly 2t → exact tile; 4 offsets by default, every offset
      with GAC_PATTERN_SWEEP set — run and passed), the 318/319 regions added to
      partial_repeats_of_brick_report_no_pattern,
      small_tiles_move_from_inside_at_every_zoom (8/16/24/32 px tiles at 5 zoom
      levels, real canvas drags: move from centre and resize from the right
      edge), a unit case for a 16 px tile with 8 px tolerance. Earlier rounds:
      Round 2 fixed the verifier's A1 and A4 failures. A1: pattern::period() now
      takes the smallest lag (≥4 px, ≤ half the extent) that is a local
      autocorrelation maximum ≥ MIN_CONFIDENCE (now 0.7), is a sharp peak (1−r
      at most 0.3× the median of the lags from half to 1.5× it, which rejects
      ripples of smooth content), and really repeats (image shifted by it
      differs by ≤0.25× the unrelated-pixel difference; measured: true periods
      ≤0.20 incl. noise σ8 and JPEG, near-periods like one running-bond course
      ≥0.30). Flat regions (luminance σ<2) are not patterns. FFT sizes are now
      the next 2·3·5-smooth size (1025² 112–123 ms vs 552 ms before). A4:
      make_seamless no longer panics for 6–7 px sides (band clamp 1..w/2−1;
      1–2-column bands use shifted content), and sides of 2–5 px are offset by
      half so the wrap edge is a pair of original neighbours (no longer returned
      unchanged). New tests: random_regions_find_the_tile_only_with_two_repeats
      (12 regions/image each way by default; 150/image = 4500 regions passed
      with GAC_PATTERN_SWEEP=150), partial_repeats_of_brick_report_no_pattern
      (the verifier's regions + flat colour),
      transparent_patterns_are_detected_and_keep_alpha, survey now reports false
      positives (0/200 per source texture, was 119/200 on brick_grey_source),
      unit tests for every small tile size 2–15 × several heights at 3 blends
      and flat/partial repeats, UI tests
      narrow_tiles_and_selections_are_made_seamless (window 1–8 px wide, Filter
      on 6 and 7 px selections) and partial_brick_selection_re Round 1 summary:
      Pattern extraction. src/pattern.rs: detect() — luminance over gray, mean
      removed, FFT (rustfft) 2-D autocorrelation, overlap-normalized axis
      profiles; period = strongest peak after the central lobe, reduced to its
      smallest integer fraction within 90 % of it (fundamental, not a harmonic;
      a weaker sub-structure such as one brick course is not taken); needs ≥2
      repeats and confidence ≥0.5, otherwise 'not found' with the whole region;
      phase = origin whose wrap edge differs least. make_seamless(): per axis,
      shift so the new wrap edge is the smoothest line near the middle, then
      patch the original back in through a minimum-error cut (DP, same position
      at first/last row so the other axis stays seamless) inside bands of
      blend×size/2, feathered; alpha processed like colour; same size.
      seam_ratio() (A5 definition) and repeat(). src/pattern_ui.rs:
      PatternDialog (region = selection bounds or whole layer, detection, tile
      in layer coordinates with clamping, manual crop drags: move inside, resize
      edges/corners, draw new outside; Make Seamless with blend 5–50 %, Revert;
      3×3 preview texture rebuilt when tile/seamless changes; params recorded)
      and canvas overlay (region outline, yellow tile outline, handles in manual
      mode). ui.rs: Extract ▸ Find Repeating Pattern… (Action::FindPattern),
      open_pattern/pattern_redetect/pattern_add/pattern_close, window drawing,
      manual crop forces the Move tool for that document and routes Move events
      to the dialog. Filter ▸ Tile ▸ Make Seamless…
      (src/filters/make_seamless.rs, Blend width % param, existing
      preview/OK/undo flow, selection bounds via render_filter). Library:
      'pattern' default category (manifest version 2 adds it once to older
      libraries; a later removal sticks), tiles saved as category pattern
      (manual), origin method 'pattern' with
      period/found/confidence/region/tile/seamless/blend; auto-tagging excludes
      'pattern' from candidates. Export: ExportFormat::Tileable{columns, rows}
      ('Tileable PNG' in the dialog, Repeat N×M 1–16), unique names via
      save_assets. Fixtures tests/fixtures/patterns: ambientCG CC0
      Bricks097/Bricks085/PavingStones138/Rock051 downscaled to known tiles and
      repeated from shifted origins + synthetic running bond (40×32), each as
      PNG, JPEG q80 and noise σ8; *_source.png whole textures; patterns.json;
      LICENSE.txt. A5 was reworded with the user's approval during Build (see
      brief Decisions)."
    truncated: false
  addressed_acceptance_ids:
