    text: "All A1-A8 pass. The round-3 regressions are fixed and were checked
      adversarially: 13,800 exhaustive near-two-repeat regions plus 9,000 random
      regions with no fake or missed periods, and small-tile drags at 6 zooms x
      13 sizes with no move/resize errors. The full repo suite (348 tests,
      including the model-backed auto-tag test and the every-offset sweep)
      passes in a separate target dir. fmt is clean and the working tree is
      unchanged."
    truncated: false
  risks:
    - text: "Near-period tolerance (MAX_SHIFT_DIFFERENCE 0.25, needed for noise sigma
        8 and JPEG) merges genuinely different alternating tiles. Adversarial
        probes: a brick tile stacked with a copy brightened by <= 12 levels
        reports half the true period (160x80 instead of 160x160); a running-bond
        tile with its left half transparent reports 40x16 instead of 40x32. The
        fixtures are unaffected."
