        truncated: false
      result: passed
      note:
        text: "All dispatch benchmark commands run locally, exit 0: detection 1024² 130
          ms, 1025² 113 ms; Make Seamless 512² 7 ms; preview frame ≤7.1 ms; Make
          Seamless filter preview 38 ms; others unchanged."
        truncated: false
  checks_truncated: false
  known_limits:
    - text: "Raw crops whose size lines up with a regular brick grid can already be
        nearly seamless (grey brick: 68/200 random crops below 1.5, min 0.95);
        A5 was reworded accordingly with the user's approval."
      truncated: false
    - text: Filter ▸ Make Seamless on a non-rectangular selection computes on the
        selection's bounding box and applies through the selection mask (like
        every filter), so only a rectangular selection yields a seamless region.
      truncated: false
    - text: Detection assumes axis-aligned lattices; rotated/perspective/hex patterns
        are non-goals.
      truncated: false
    - text: "Detection thresholds have measured but finite margins: noise much
        stronger than σ8 on low-contrast textures could make a true period fail
        the shift test (stone σ8 scores 0.20 vs threshold 0.25)."
      truncated: false
    - text: Find Repeating Pattern analyzes the active layer's pixels even while its
        mask is the edit target (same as Auto-Detect).
      truncated: false
    - text: The Filter menu is flat with category headings, so Make Seamless… appears
        in the Filter menu under the 'Tile' heading.
      truncated: false
    - text: Make Seamless on a side under 6 px only offsets that axis by half (the
        wrap edge becomes a pair of original neighbours, but the seam ratio of
        such tiny sides can rise).
      truncated: false
    - text: Periods under 4 px are not reported as the minimum (a 3 px period comes
        back as a multiple).
      truncated: false
  known_limits_truncated: false
