    - text: On very small tiles the edge grab zone is only size/4 image px (e.g.
        0.25-0.75 px for 1-3 px tiles at 1x zoom), so resizing tiny tiles needs
        precise pointing or zooming in. Moving works from inside at every zoom
        tested.
      truncated: false
    - text: While the pattern window is open, dialog_open() blocks other extraction
        dialogs and filters (e.g. Filter > Make Seamless) until it is closed.
      truncated: false
    - text: Filter > Make Seamless on a non-rectangular selection is computed on the
        bbox and blended through the mask (builder known limit), so only
        rectangular selections come out seamless.
      truncated: false
    - text: There is no repo headless test that clicks 'Tileable PNG' in the export
        dialog; it was verified only by this verifier's probe.
