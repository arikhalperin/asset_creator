acceptance:
  - id: A1
    source: brief.md
    text: "A1: Extract ▸ Find Repeating Pattern… (enabled with an editable raster
      layer) opens a window that analyzes the selection's bounding box (or the
      whole active layer) and shows the detected period (W × H px) and a
      confidence; the proposed tile is outlined on the canvas; when the region
      holds fewer than two repeats per axis or no clear period, it says \"No
      repeating pattern found\" and proposes the whole region."
    result: passed
    reason:
      text: "Extract > Find Repeating Pattern... is wired (Action::FindPattern,
        enabled like Auto-Detect). It analyzes editable_bounds (selection bbox
        or whole layer) and shows 'Period W x H px (confidence N %)' or 'No
        repeating pattern found', with a yellow tile outline on the canvas (repo
        UI tests). The round-2/3 failure is fixed: period candidates must be <=
        extent/2 and be real peaks with neighbours on both sides. My exhaustive
        probe covered all 15 fixtures, every start offset 0..t-1, region lengths
        2t-3..2t+1 on each axis (with the other axis offset too), plus both axes
        at 2t-1/2t/2t+1. That is 13,800 regions with 0 failures: never found
        below 2t (whole region proposed), always the exact tile at 2t and 2t+1.
        9,000 random regions (300 per fixture with both axes >= 2t, 300 with one
        axis short, other axis random 8..H) had 0 failures. 1,600 random crops
        of the 4 source textures, noise, gradient, radial, smooth sines, flat,
        fully transparent and alpha-noise images all gave no pattern. Regions
        under 8 px give the whole region. Checker and sine lattices are found
        exactly. The repo test just_under_two_repeats_is_no_pattern with
        GAC_PATTERN_SWEEP (every offset) passed."
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: On the fixture images (brick, stone, and cobblestone walls built from
      CC0 textures tiled a known number of times, plus synthetic running-bond
      brick, also saved as JPEG quality 80 and with added noise σ=8), the
      detector returns exactly the known tile size, independent of where the
      analyzed region starts (the minimal tile: e.g. two courses for running
      bond)."
    result: passed
    reason:
      text: The repo test
        detector_recovers_the_known_tile_size_wherever_the_region_starts passes
        on all 15 fixtures (PNG, JPEG q80, noise sigma 8), with detected tiles
        <= 1.15 seam. My random sweep (300 regions per fixture at random offsets
        and sizes >= 2t) and the exhaustive offset sweep always returned exactly
        the patterns.json tile, including running bond = two courses (40x32,
        160x80, 120x60).
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Manual crop mode: the tile can be moved and resized by dragging on
      the canvas or typed as X/Y/W/H (clamped to the layer); the 3×3 tiled
      preview updates live (within one frame for tiles up to 512×512)."
    result: passed
    reason:
      text: "Earlier failure fixed: the grab zone is min(8 screen px, size/4) per
        axis. My headless probe made real canvas drags at 6 zoom levels (about
        0.35x to 8x) on tiles of 1,2,3,4,5,6,8,12,16,20,24,32,64 px. Centre
        drags and off-centre inside drags (35%/65%) always moved the tile by the
        exact amount. Right, left, top, bottom, top-left and bottom-right edge
        drags resized exactly as expected. The preview texture matched the tile
        after each drag: 0 failures. Typing in the X/W DragValue fields through
        the UI (click, select-all, type, Enter) set X=190; W was clamped to the
        layer (10 px), and W=64 stayed clamped. The repo tests cover drawing
        outside, clamping and the Brush coming back. The release
        bench_pattern_preview frame with a 512x512 tile took <= 7 ms."
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Make Seamless in the window (blend width 5–50 %, default 25 %)
      replaces the preview's tile with a seamless version of the same size
      (Revert restores it); Filter ▸ Make Seamless… applies the same operation
      to the active layer, or to the selection's bounding box, with live preview
      and one undo step."
    result: passed
    reason:
      text: "Window: blend defaults to 25 and the slider runs 5..50. My probe on 5
        tiles (including 7x9 and 128x256) at blends 5/17/25/50: the result has
        the same size and equals pattern::make_seamless(raw, b); the preview
        shows the 3x3 repeat of the seamless tile; seam <= 1.15 (worst 0.67);
        Revert restores the raw tile and preview. Filter > Make Seamless (Tile
        category, 'Blend width (%)' 5-50): the live preview on the layer equals
        make_seamless at 25/5/50/33 and is clamped to 50 for 80; Cancel restores
        the layer with no undo step; OK adds exactly one undo step; undo and
        redo are exact. Rectangular selections (101x77, 6x50, 60x7, 6x6, 256x13)
        change only the bbox, which equals make_seamless(crop). A panic sweep of
        every size 1..40 x 1..40 at 4 blends found no panic and the size kept."
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Seam metric: for a tile, the mean absolute RGB difference across the
      wrap-around edges (last column vs first, last row vs first) divided by the
      mean difference between adjacent interior columns/rows; seamless means ≤
      1.15. Tests: on a fixed set of 16 crops of the four fixture textures (4
      each, sizes not lined up with the texture's repeat) every raw crop scores
      > 1.15 (a measurable seam), and after Make Seamless every result is ≤ 1.15
      at blend widths 5 %, 25 %, and 50 %; detected tiles of the periodic
      fixtures are ≤ 1.15 without any processing; a survey of 200 random crops
      per texture is reported (raw crops whose size happens to line up with a
      regular brick grid can already be nearly seamless)."
    result: passed
    reason:
      text: "seam_ratio implements the A5 definition. The repo test
        make_seamless_closes_the_seam_of_arbitrary_crops (16 fixed crops: raw >
        1.15, seamless <= 1.15 at 5/25/50 %) passes. Detected fixture tiles are
        <= 1.15 in the detector test. survey_of_random_crops reports 200 per
        texture. My extra probe: 3,150 random crops of sources and fixtures
        (16..250 px) x 3 blends had 0 above 1.15 (worst 0.99)."
      truncated: false
  - id: A6
    source: brief.md
    text: 'A6: Add to Library saves the current tile (seamless version if applied)
      as an asset in category "pattern" (manual), with origin method "pattern"
      and parameters (period, tile rectangle, seamless, blend width); "pattern"
      is a default category, added to existing libraries when missing;
      auto-tagging never proposes "pattern".'
    result: passed
    reason:
      text: "Add to Library stores tile_image() (the seamless version when applied)
        with category 'pattern', CategorySource::Manual and origin method
        'pattern'. Params are period, found, confidence, region, tile, seamless
        and blend (probe: tile [5,7,50,60], period [72,144], seamless true,
        blend 40). These persist (manifest version 2) and reload. 'pattern' is
        in DEFAULT_CATEGORIES. v1 libraries get it once before 'other' with no
        duplicate if already present, and a later removal sticks; pattern_add
        re-creates the category if the user removed it. The tagger candidate
        list excludes 'pattern'. The model-backed repo test
        auto_tagging_never_proposes_pattern ran with GAC_CLIP_DIR and passed:
        plain assets are never tagged pattern, and even a forced Auto-Tag picks
        another category."
      truncated: false
  - id: A7
    source: brief.md
    text: 'A7: Export… has a "Tileable PNG" format: one `<name>.png` per selected
      asset at its exact size, or with Repeat N×M (1–16 each) the tile repeated
      N×M; a test checks the repeated image equals the tile at every offset and
      that export names never overwrite.'
    result: passed
    reason:
      text: "ExportFormat::Tileable{columns,rows} is clamped to 1..16 and uses
        repeat() plus save_assets (free_entry_path). Probe: with 2 assets at
        16x16, every pixel equals the tile at x%w,y%h. A pre-existing user file
        '<name>.png' was not overwritten (export wrote '<name> (2).png'). A
        second export never reused a path, and 0 is clamped to 1 (the exact
        tile). The export dialog shows a 'Tileable PNG' option; clicking it
        shows 'Repeat' fields and format() gives Tileable{1,1}. The repo test
        tileable_png_export_repeats_and_never_overwrites passes."
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: Detection on a 1024×1024 region takes under 500 ms and Make Seamless
      on a 512×512 tile under 200 ms in a release build."
    result: passed
    reason:
      text: "Release probe, worst of 3 runs per case: 1024x1024 detection took 112-129
        ms (periodic, stone, noise). Odd sizes took 102-166 ms (1023^2, 1025^2,
        1021x1031, 1031^2, 1024x1000). Make Seamless 512x512 took <= 6 ms at
        blends 5/25/50; 511 and 509 were faster. The runtime bench log agrees:
        122 ms / 7 ms; the filter preview at 1080p was 40 ms."
      truncated: false
builder_handoff:
  candidate_id: 8e4a4796-0aff-4869-b547-8c05ae0cd0c1
