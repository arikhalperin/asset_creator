        truncated: false
      result: passed
      note:
        text: 348 passed, 0 failed (GAC_CLIP_DIR/GAC_MODEL_DIR set);
          GAC_PATTERN_SWEEP=150 sweep (4500 random regions + every offset just
          under/at two repeats) passed.
