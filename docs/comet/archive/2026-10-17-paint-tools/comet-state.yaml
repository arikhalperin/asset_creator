acceptance:
  - id: A1
    source: brief.md
    text: "A1: The Tools panel adds Brush (B), Eraser (E), Eyedropper (I), Paint
      Bucket and Gradient (G toggles between them), and Clone Stamp (S); only
      Move remains as a disabled placeholder; shortcuts are ignored while typing
      or with Cmd/Ctrl held."
    result: passed
    reason:
      text: Tool enum adds Brush/Eraser/Eyedropper/PaintBucket/Gradient/CloneStamp;
        PLACEHOLDER_TOOLS is only Move; B/E/I/G(after_g toggle)/S consumed only
        when !typing && !command. tests/paint.rs
        paint_tool_shortcuts_colors_and_size covers each key, G toggling, and
        Cmd+B ignored.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Foreground/background swatches (default opaque black / opaque white)
      appear in the Tools panel; clicking one opens an RGBA color picker for it;
      the swap button or X exchanges them; the reset button or D restores
      black/white."
    result: passed
    reason:
      text: Colors default black/white; tools_panel shows FG/BG
        color_edit_button_srgba_unmultiplied (RGBA picker), swap and Reset
        buttons; X/D actions tested in paint_tool_shortcuts_colors_and_size.
        Picker/button clicks themselves not driven by tests (code inspection
        only).
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Brush paints the foreground color on the active layer with Size
      (1–500, default 20), Hardness (0–100 %, default 100 %), and Opacity (1–100
      %, default 100 %). Strokes are anti-aliased: edge pixels get partial
      coverage even at 100 % hardness, and lower hardness widens a smooth
      falloff. Verified by unit tests of dab coverage."
    result: passed
    reason:
      text: BrushSettings defaults 20/100%/100%, size clamp 1-500, options strip
        ranges; dab_coverage implements w=max(r(1-h),1) with smoothstep for h<1.
        Unit tests coverage_hard_edge_is_antialiased and
        stamp_has_partial_edges_unless_pixel_mode assert the 1-px ramp at 100%
        and wider monotone falloff for soft brushes.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Stroke interpolation: dabs are spaced at most 15 % of the size
      (minimum 0.5 px) along a Catmull-Rom curve through the pointer samples, so
      a stroke whose samples are far apart (e.g. 200 px between frames) leaves a
      continuous band with no gaps; verified by a unit test and a canvas test
      with sparse pointer events."
    result: passed
    reason:
      text: StrokeSampler spaces dabs max(0.15*size,0.5) along uniform Catmull-Rom;
        unit tests sampler_spaces_dabs_evenly_and_finishes,
        catmull_rom_passes_through_samples_and_curves,
        sparse_fast_stroke_has_no_gaps (200 px samples) and UI test
        fast_brush_stroke_is_continuous_live_and_one_undo_step (per-column gap
        check with one-frame jumps).
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Opacity is capped per stroke: where a stroke overlaps itself the
      result never exceeds the stroke opacity (e.g. a 50 % black stroke over
      white stays ~50 % gray even where it crosses), while a second stroke
      builds on top. Verified by tests."
    result: passed
    reason:
      text: StrokeMask accumulates by max and amount = cov*opacity from the stroke
        snapshot; opacity_is_capped_within_a_stroke asserts ~128 after
        back-and-forth at 50% and ~64 after a second stroke.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: Pixel mode (Brush and Eraser, default off) produces only fully
      covered or untouched pixels; a 1-pixel brush draws a connected
      single-pixel line. Verified by tests."
    result: passed
    reason:
      text: Pixel mode snaps centers and uses binary coverage with 0.5 px spacing;
        stamp test asserts only 0/255 and one pixel for size 1;
        pixel_mode_one_pixel_line_is_connected_and_hard asserts binary,
        8-connected, thin line. Pixel checkbox on Brush/Eraser only, default
        off.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: Eraser reduces alpha toward transparent by coverage × opacity using
      its own Size/Hardness/Opacity/Pixel options."
    result: passed
    reason:
      text: eraser_pixel multiplies alpha by 1-amount/255 keeping color; own eraser
        BrushSettings (per-tool test checks eraser size unaffected by brush [
        ]). eraser_reduces_alpha unit test and eraser_makes_pixels_transparent
        UI test.
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: Shift+click with Brush, Eraser, or Clone Stamp paints a straight
      stroke from the previous stroke's end point to the click."
    result: passed
    reason:
      text: Shift+press emits StrokeBegin{straight}+StrokeEnd; handle_canvas_event
        starts at last_stroke_end and continues to the click, applies to
        Brush/Eraser/Clone (shared brush-tool path).
        shift_click_paints_a_straight_line verifies points along the line and an
        off-line pixel untouched. Only Brush exercised by test; Eraser/Clone
        share the code path.
      truncated: false
  - id: A9
    source: brief.md
    text: 'A9: Eyedropper: click sets the foreground color, Option/Alt+click the
      background color, sampling the visible composite by default or the active
      layer when Sample is "Active layer"; it creates no undo step.'
    result: passed
    reason:
      text: Pick event uses Alt for background; sample_color reads composite or active
        layer; eyedropper_samples_composite_or_layer (with half-opacity top
        layer) and eyedropper_sets_foreground_and_background_without_undo (FG,
        Alt BG, undo length unchanged, active-layer option).
      truncated: false
  - id: A10
    source: brief.md
    text: "A10: Paint Bucket fills the clicked color region of the active layer
      (Tolerance 0–255, default 32; Contiguous default on) with the foreground
      color at the tool opacity."
    result: passed
    reason:
      text: BucketFill uses selection::magic_wand region with tolerance/contiguous,
        blends to FG by opacity via apply_masked; defaults 32/on/100%.
        bucket_fills_region_with_opacity_and_selection (barrier, non-contiguous,
        50%) and paint_bucket_fills_region UI test.
      truncated: false
  - id: A11
    source: brief.md
    text: "A11: Gradient: dragging paints Linear (default) or Radial gradients from
      start to end, Foreground→Background (default) or Foreground→Transparent,
      composited over the active layer at the tool opacity; the start pixel
      shows the foreground color and pixels at/after the end the end color; a
      start-to-end line is previewed while dragging."
    result: passed
    reason:
      text: GradientFill linear/radial positions clamped, FG->BG or FG->transparent
        premultiplied mix, blend_over at opacity, <1px rejected;
        gradient_positions, gradient_fills_fg_to_bg_and_to_transparent
        (start=FG, end=end color), gradient_drag_paints_linear_and_radial UI
        test. Preview line is drawn from the Drag gesture in canvas.rs but not
        asserted by a test (visual-only).
      truncated: false
  - id: A12
    source: brief.md
    text: "A12: Clone Stamp: Option/Alt+click sets the source; strokes copy from the
      active layer as it was when the stroke began, offset by (source − first
      stroke point); Aligned (default on) keeps the offset across strokes, off
      restarts at the source each stroke; painting without a source shows a
      message and changes nothing."
    result: passed
    reason:
      text: Alt+click sets source (resets offset); offset = source - start, kept when
        Aligned, recomputed otherwise; Clone reads from stroke snapshot,
        out-of-image sources unchanged; no source -> CLONE_SOURCE_HINT and no
        step. clone_copies_from_snapshot_with_offset and
        clone_stamp_needs_source_and_copies_aligned cover all of these.
      truncated: false
  - id: A13
    source: brief.md
    text: "A13: Every paint tool respects the selection mask: unselected pixels are
      unchanged and partially selected pixels change proportionally. Verified
      per tool by tests."
    result: passed
    reason:
      text: "Strokes blend painted result by selection mask per pixel
        (blend_by_mask(old,painted,sel)); bucket/gradient go through
        apply_masked. Per-tool tests now exist: brush
        (strokes_respect_selection_and_undo_exactly), eraser
        (eraser_respects_selection), clone (clone_respects_selection), bucket
        and gradient (bucket_and_gradient_interpolate_partial_selection), each
        asserting full/unselected/half-selected pixels; UI tests
        paint_tools_respect_the_selection and
        eraser_and_clone_respect_selection_through_the_ui. Note
        clone_respects_selection's unselected check at x=35 is vacuous (source
        x=60 is out of image), but the UI test's non-aligned clone at x=220 from
        a black source is a real unselected check, and the half-selected x=30
        assertion is real. Eyedropper does not edit pixels (N/A)."
      truncated: false
  - id: A14
    source: brief.md
    text: 'A14: Each stroke, bucket click, and gradient drag is exactly one undo
      step ("Brush Stroke", "Eraser Stroke", "Clone Stamp", "Paint Bucket",
      "Gradient"); undo/redo restore exact pixels; only tiles touched by the
      edit are refreshed; a stroke abandoned by switching tool or document
      mid-stroke restores the pixels and records nothing.'
    result: passed
    reason:
      text: end_stroke records one PixelPatch with kind label; BucketFill 'Paint
        Bucket', GradientFill 'Gradient'; patch rect = stroke bounds ∩ editable
        bounds; undo/redo exactness asserted in
        strokes_respect_selection_and_undo_exactly, bucket test, app_state
        stroke_lifecycle_records_one_step;
        strokes_refresh_only_the_tiles_they_touch shows undo re-uploads exactly
        1 tile of 16. Tool switch abandon tested in
        switching_tool_mid_stroke_discards_it; document switch calls
        cancel_all_strokes (unit-tested in
        cancelled_or_interrupted_strokes_record_nothing) but not driven through
        a UI document switch.
      truncated: false
  - id: A15
    source: brief.md
    text: "A15: The tool-options strip shows each paint tool's options: Brush/Eraser
      Size, Hardness, Opacity, Pixel; Clone Stamp Size, Hardness, Opacity,
      Aligned; Paint Bucket Tolerance, Contiguous, Opacity; Gradient Type,
      Colors, Opacity; Eyedropper Sample. Each tool keeps its own values."
    result: passed
    reason:
      text: tool_options_strip shows Size/Hardness/Opacity/Pixel for Brush and Eraser,
        Size/Hardness/Opacity/Aligned for Clone, Tolerance/Contiguous/Opacity
        for bucket, Type/Colors/Opacity for gradient, Sample for eyedropper;
        separate fields per tool in ToolOptions (per-tool test). Strip rendered
        for every tool headlessly in
        brush_cursor_circle_and_options_strip_render; widget content not
        asserted.
      truncated: false
  - id: A16
    source: brief.md
    text: "A16: Strokes appear live on the canvas while painting; Brush/Eraser/Clone
      Stamp show a brush-size circle cursor; Clone Stamp shows its source
      marker; [ and ] change the current brush size; Space/middle drag and
      wheel/pinch still navigate with paint tools active."
    result: passed
    reason:
      text: Live painting and tile refresh before release asserted in
        fast_brush_stroke_is_continuous_live_and_one_undo_step and
        tail_is_shown_live_and_replaced_by_final_curve; brush circle (radius 10
        at 100%, cursor hidden) asserted; clone marker drawn via cross() (not
        asserted); [ ] tested; space_drag_pans_instead_of_painting plus existing
        middle-drag/wheel navigation, which run before tool dispatch.
      truncated: false
