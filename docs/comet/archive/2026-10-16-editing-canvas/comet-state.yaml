  builder_execution_ref: skill-coordinated:builder:ec83506f-14a0-4fee-9c7a-f3b7a33d1569
  iteration: 2
  summary:
    text: "Repair for A7: egui-wgpu ignores TextureOptions.mipmap_mode (textures
      created with mip_level_count 1), so minified views had no mipmaps.
      TileCache now builds a CPU mip pyramid (up to 8 levels, 2x box filter
      averaged in premultiplied alpha, CPU level images updated only in dirty
      regions, per-level tile textures). The canvas draws from
      mip_level_for_zoom(zoom): level 0 when zoom >= 1 (nearest magnification),
      otherwise the smallest level still at or above display resolution with
      linear filtering, so GPU minification is always < 2x. uploads() still
      reports full-resolution tile uploads; level_uploads(k) per level. New
      tests: mip level selection, level sizes/rect mapping, premultiplied
      downsample (no hidden-colour bleed), partial refresh equals full rebuild
      with exactly one tile per level re-uploaded, and an integration test that
      a Fit view of 4000x4000 draws <=20 meshes (level-2 tiles) instead of 256.
      Everything else unchanged from iteration 1: Added src/undo.rs (Command
      trait, UndoStack with per-command cost recorded at push and 1 GB budget
      dropping oldest, FillLayer), src/canvas.rs (ViewState math:
      cursor-anchored zoom, fit/actual/initial, clamp 1%-6400%;
      TileGrid/TileCache with 256px tiles and dirty marking + upload counters;
      CanvasState widget: Cmd/Ctrl+wheel and pinch zoom, scroll pan, Space+drag
      and middle-drag pan with grab cursors, screen-space checkerboard texture,
      nearest-mag/linear+mipmap-min tile textures, pixel grid when zoom > 8 and
      toggle on). Document gained PixelRect, bounds() and composite_region().
      AppState: per-document UndoStack, active layer (default top, kept in
      range), dirty-rect queue, execute/undo/redo/set_active_layer/take_dirty;
      public document_mut removed. UI: Edit menu (Undo/Redo with labels, Fill
      Layer... dialog with RGBA picker remembering last color), View menu zoom
      items + Show Pixel Grid, shortcuts Cmd+Z / Cmd+Shift+Z / Cmd+Y / Cmd+= /
      Cmd+- / Cmd+0 / Cmd+1 (egui keyboard UI-zoom disabled), Layers rows
      selectable for active layer, status bar zoom % and hover pixel. Shortcuts
      are suppressed only when a text edit is focused (fixed a bug where canvas
      focus from Space would have blocked them)."
    truncated: false
