acceptance:
  - id: A1
    source: brief.md
    text: "A1: The Tools panel offers Rectangle Select, Ellipse Select, Lasso,
      Polygon Lasso, and Magic Wand; the active tool is highlighted (Rectangle
      Select at startup); M toggles Rectangle/Ellipse, L toggles Lasso/Polygon
      Lasso, W picks Magic Wand; these single-key shortcuts do nothing while a
      text field is focused or Cmd/Ctrl is held."
    result: passed
    reason:
      text: Tool enum (tools.rs) lists the five tools with Rectangle Select as
        default; tools_panel renders selectable_label(tool==active) for each,
        followed by the disabled placeholders. read_shortcuts sends M/L/W to
        after_m/after_l/MagicWand only when !typing && !modifiers.command.
        tests/selection.rs tools_panel_default_and_single_key_shortcuts drives
        the M/L/W toggles, the Cmd+M no-op and a focused text field. The
        highlight and panel clicks are checked by reading the code only; no test
        exercises them.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Rectangle Select: dragging selects exactly the pixels whose centers
      lie inside the dragged rectangle (clipped to the document, hard edges); a
      click without dragging in Replace mode clears the selection. Verified by
      unit tests on synthetic images and a canvas drag test."
    result: passed
    reason:
      text: rect_mask uses pixel-center inclusion clipped to the document and only
        writes 0/255. Unit test rect_selects_pixel_centers_inside covers
        centers, drag direction, clipping and the too-small case. Canvas test
        rectangle_drag_selects_and_click_clears checks the exact bounds after a
        drag and that a Replace-mode click clears the selection ('Deselect').
        SelectionShape::Clear is a no-op in other modes (tools.rs unit test).
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Ellipse Select selects the inscribed ellipse; with Anti-alias on,
      edge pixels hold coverage-proportional values (4×4 supersampling) and
      interior pixels 255; with it off, values are only 0/255 by pixel-center
      test. Verified by unit tests."
    result: passed
    reason:
      text: ellipse_mask tests the inscribed ellipse through rasterize, which takes
        4x4 samples when anti-aliased and the pixel center otherwise. Unit test
        ellipse_hard_and_antialiased checks hard values are only 0/255, the area
        is about pi r^2, soft edges exist with interior 255, and coverage
        matches the area. Canvas test ellipse_drag_with_and_without_antialias
        toggles the option.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Lasso: dragging a closed freehand path selects its interior by the
      even-odd rule, with the same Anti-alias behaviour; fewer than 3 distinct
      points selects nothing. Verified by unit tests (e.g. a triangle and a
      self-intersecting path)."
    result: passed
    reason:
      text: polygon_mask uses an even-odd crossing test with the same rasterizer and
        returns empty for fewer than 3 distinct points. Unit test
        polygon_triangle_and_even_odd covers a triangle (hard and AA coverage),
        the pentagram center hole, and the degenerate case. Canvas test
        lasso_drag_selects_enclosed_area drives a freehand drag ('Lasso
        Select').
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Polygon Lasso: clicks add vertices; clicking within 6 points of the
      first vertex, double-clicking, or pressing Enter closes and applies it (≥3
      vertices); Backspace removes the last vertex; Escape cancels; edges and a
      segment to the pointer are previewed. Verified by unit and canvas input
      tests."
    result: passed
    reason:
      text: "Fix verified: in canvas.rs run_tool, a click within
        POLYGON_CLOSE_DISTANCE=6 screen points of the first vertex now always
        returns close(self.gesture.take()). close yields a request only when
        there are at least 3 points, so with fewer the gesture is dropped and
        nothing is applied. New test
        clicking_first_vertex_with_too_few_points_cancels (2 vertices, click
        about 2.2 pt from the first after the double-click window) asserts the
        polygon is gone, there is no selection and no undo step; under the
        iteration-1 behaviour it would have failed. Other behaviour holds: Enter
        closes, or cancels with fewer than 3; double/triple-click closes;
        Backspace pops; Escape cancels; switching tools or documents cancels;
        edges plus a segment to the pointer are previewed. Covered by
        polygon_lasso_clicks_enter_backspace_escape,
        polygon_closes_on_first_vertex_and_on_double_click and
        switching_tools_cancels_polygon. All pass in my own cargo test run."
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: Magic Wand selects pixels of the active layer within Tolerance (max
      RGBA channel difference, default 32) of the clicked color; Contiguous
      (default on) restricts to the 4-connected region; edges are hard. Verified
      by unit tests on synthetic images (including a same-colour region
      separated by a barrier, with Contiguous on and off)."
    result: passed
    reason:
      text: magic_wand uses the max absolute RGBA channel difference <= tolerance, a
        4-neighbour flood fill when contiguous, a global match otherwise, and
        hard 0/255 values; clicks outside select nothing. Unit tests
        magic_wand_contiguous_and_global (barrier column, contiguous on/off,
        tolerance, alpha channel) and magic_wand_is_four_connected. tools.rs
        wand_uses_active_layer_and_options and canvas test
        magic_wand_selects_matching_region_of_active_layer pass. Tolerance
        defaults to 32 and contiguous to true.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: The selection is stored on the document as an 8-bit mask of the
      document's size; masks of the wrong size are rejected; an all-zero result
      clears the selection; with no selection, edits apply to the whole
      document."
    result: passed
    reason:
      text: "Document.selection: Option<GrayImage>. set_selection rejects the wrong
        size with SelectionSizeMismatch, leaving the selection unchanged, and
        normalizes an all-zero mask to None. editable_bounds is the whole
        document when nothing is selected, and the selection is not composited.
        Unit test selection_mask_is_validated_and_normalized and undo test
        wrong_size_selection_is_rejected pass. combine and the other ops also
        normalize."
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: Combine modes: Replace = b, Add = max(a, b), Subtract =
      round(a·(255−b)/255), Intersect = min(a, b); Shift / Option(Alt) /
      Shift+Option held at gesture start select Add / Subtract / Intersect,
      otherwise the tool-options mode (Replace by default) applies. Verified by
      unit tests and a canvas test with modifiers."
    result: passed
    reason:
      text: combine implements Replace=b, Add=max, Subtract=round(a*(255-b)/255),
        Intersect=min, and treats a missing mask as 0. from_modifiers maps Shift
        to Add, Alt to Subtract and Shift+Alt to Intersect, otherwise the strip
        mode. The mode is captured at drag start or first click. Unit tests
        combine_modes (including 128 -> 64) and modifiers_pick_mode pass. Canvas
        test modifiers_choose_combine_mode drives Shift, Alt, Shift+Alt and the
        strip's Add mode.
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: Select → All (Cmd/Ctrl+A), None (Cmd/Ctrl+D), Invert
      (Cmd/Ctrl+Shift+I) behave as specified (Invert with no selection selects
      everything)."
    result: passed
    reason:
      text: The Select menu has All (Cmd+A), None (Cmd+D) and Invert (Cmd+Shift+I)
        shortcuts, bound only when no text field is focused; Invert is matched
        before the plain Cmd shortcuts. All and Invert need a document; None
        needs a selection. invert(None) selects everything. Canvas test
        select_menu_shortcuts sends the real key events and checks the results
        and labels.
      truncated: false
  - id: A10
    source: brief.md
    text: "A10: Select → Grow… / Shrink… (radius 1–100 px) dilate / erode the mask
      with a Euclidean disk; Shrink does not erode from the canvas edge.
      Verified by unit tests."
    result: passed
    reason:
      text: grow and shrink use a disk max/min built from half-widths
        floor(sqrt(r^2-dy^2)). Shrink pads outside the document with 255, so the
        canvas edge does not erode. The dialog accepts whole numbers 1-100 and
        shows an inline error otherwise. Unit tests grow_and_shrink_use_a_disk
        (29 lattice points for r=3, round trip),
        shrink_does_not_erode_from_canvas_edge, grow_preserves_soft_values and
        large_operations_are_bounded_to_the_selection pass. Canvas test
        grow_shrink_feather_dialogs checks the defaults, invalid input, labels
        and exact bounds.
      truncated: false
  - id: A11
    source: brief.md
    text: "A11: Select → Feather… (radius 1–100 px, default 5) produces a soft edge:
      across a hard straight edge the values ramp monotonically from 255 to 0,
      with intermediate values present, 255 more than 2r inside and 0 more than
      2r outside. Verified by unit tests."
    result: passed
    reason:
      text: feather is a separable Gaussian with sigma=r/2, a kernel truncated at
        ceil(3 sigma), clamped edges and the default radius 5. Unit test
        feather_produces_a_soft_monotonic_edge checks the edge is monotonic, has
        intermediate values, is 255 deeper than 2r inside and 0 farther than 2r
        outside, and is clamped at the edge. Dialog test checks the default 5,
        the 'Feather Selection' label and soft values.
      truncated: false
  - id: A12
    source: brief.md
    text: "A12: Marching ants: a selection's boundary (mask ≥ 128 vs < 128 or
      outside the document) is drawn as alternating black/white 4-point
      screen-space dashes that move over time, and the canvas keeps repainting
      while a selection exists. Verified by unit tests of the outline and a
      canvas test showing the drawn dash pattern changes between frames at
      different times."
    result: passed
    reason:
      text: outline thresholds at >=128 and treats outside the document as unselected;
        segments are merged. Unit test outline_of_rectangle_and_hole covers the
        128 split, the document edge and a ring. The canvas draws a white line
        with black dashes of 4 points, offset by ant_phase (one dash per 0.25
        s), anchored in screen space, culled to the visible area, recomputed
        only when the selection revision changes, and repainted every 40 ms
        while a selection exists. Canvas test
        marching_ants_animate_and_request_repaint checks the dashes differ at
        t+0.1, repeat at t+0.5, the repaint delay is <=100 ms, and there are no
        ants after deselect. Only checked headlessly; I did not watch it animate
        in the live app.
      truncated: false
  - id: A13
    source: brief.md
    text: 'A13: Every selection change is an undoable, redoable step labelled after
      the operation (e.g. "Undo Rectangle Select", "Undo Feather Selection");
      selection-only changes re-upload no canvas tiles.'
    result: passed
    reason:
      text: SetSelection stores the old and new masks, returns an empty dirty rect,
        reports changes_selection, and is labelled per operation
        (Rectangle/Ellipse/Lasso/Polygon Select, Magic Wand, Select All,
        Deselect, Invert Selection, Grow/Shrink/Feather Selection). The Edit
        menu shows 'Undo <label>' (unchanged C2 mechanism). Unit test
        set_selection_undo_redo_is_exact_and_changes_no_pixels and canvas
        undo/redo tests pass. rectangle_drag_selects_and_click_clears asserts no
        tile uploads after a selection change.
      truncated: false
  - id: A14
    source: brief.md
    text: "A14: Fill Layer respects the selection: fully selected pixels become the
      fill color, unselected pixels are unchanged, partially selected pixels are
      interpolated in proportion to the mask; undo restores exact pixels; only
      the selection's bounding box is marked dirty. Pixel-changing commands use
      one shared masked-apply helper."
    result: passed
    reason:
      text: "FillLayer goes through the shared apply_masked helper: per-pixel
        blend_by_mask in premultiplied alpha, skipping mask=0, saving only the
        editable_bounds region and reporting it as dirty. Unit tests
        fill_respects_selection_mask (full, partial and unselected pixels, bbox
        dirty, memory = bbox bytes, exact undo) and
        blend_by_mask_interpolates_premultiplied pass. Canvas test
        fill_respects_selection_through_the_ui shows exactly one tile was
        re-uploaded. FillLayer is the only pixel command so far."
      truncated: false
  - id: A15
    source: brief.md
    text: "A15: The tool-options strip shows Replace/Add/Subtract/Intersect buttons
      for every selection tool, an Anti-alias checkbox (default on) for Ellipse,
      Lasso, and Polygon Lasso, and Tolerance (0–255, default 32) plus
      Contiguous (default on) for Magic Wand."
    result: passed
    reason:
      text: tool_options_strip always shows Replace/Add/Subtract/Intersect via
        selectable_value. It shows the Anti-alias checkbox when uses_antialias
        (Ellipse, Lasso, Polygon), and Tolerance (DragValue 0..=255) plus
        Contiguous for MagicWand. ToolOptions defaults are Replace,
        antialias=true, tolerance=32, contiguous=true (unit test defaults).
        Strip contents are checked by reading the code only; no test clicks
        these widgets.
      truncated: false
  - id: A16
    source: brief.md
    text: "A16: With a selection tool active, Space+drag and middle-drag still pan,
      wheel/pinch still zoom, and no selection is created by those gestures; the
      pointer is a crosshair over the image."
    result: passed
    reason:
      text: run_tool is skipped while panning or while Space is held, and the existing
        C2 navigation stays in place. Canvas test
        navigation_still_works_with_selection_tools covers Space+drag,
        middle-drag (no selection created) and pinch zoom. Crosshair is set over
        the image when not panning; test crosshair_cursor_over_image passes.
      truncated: false
