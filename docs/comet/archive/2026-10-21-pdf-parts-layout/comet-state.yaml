    text: "All A1-A8 pass. Both A7 and A8 defects from round 5 are fixed: frame
      drags follow the pointer to under 0.5 px at every zoom up to 800 %, and
      unreadable or hidden folder files are skipped and listed with consistent
      page indices. The new guards work: an over-A0 file DPI is taken as A3, a
      huge override is refused, and a cancelled export leaves an earlier
      export's PDF and PNGs byte-identical with no .part leftovers. Checks:
      cargo fmt --check OK, clippy --all-targets -D warnings OK, cargo test all
      green, release pdf_ui 20/20, bench_pdf render 142 ms / detect 264 ms /
      pack 0 ms."
    truncated: false
  risks:
    - text: "images::load_page accepts non-finite or huge overrides: inf or 1e9 dpi
        gives a 1x1 px page. This is unreachable from the UI, because the
        DragValue clamps to 50-4800, but the API does not guard against it."
      truncated: false
    - text: A new export with fewer sheets, or without PNGs, leaves stale
        <stem>_NN.png files from an earlier export next to the new PDF.
      truncated: false
    - text: "If a loader or export worker thread panics, the tab stays in 'loading' or
        'exporting' because a disconnected channel is not detected. I could not
        trigger this with corrupt inputs: decode errors are skipped."
      truncated: false
    - text: Whole images are decoded and resampled in memory, so a page near A0 at 300
        dpi needs about 0.5 GB.
      truncated: false
    - text: A one-off UI frame of about 150 ms can occur when a large multi-page load
        finishes (final rebuild). It was 38-50 ms in other runs; p95 stays under
        0.4 ms.
      truncated: false
