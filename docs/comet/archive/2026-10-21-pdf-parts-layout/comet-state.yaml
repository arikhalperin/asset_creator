  known_limits:
    - text: The title line can come out as several proposals (each deletable).
      truncated: false
    - text: Export embeds 300-dpi raster images (not the PDF's vectors), per the
        confirmed scope.
      truncated: false
    - text: The tab's look was checked only through headless UI tests (no screenshot
        review).
      truncated: false
    - text: Editing proposals (Merge/Delete/Refine) or toggling a manual page re-packs
        the layout (manual moves and splits are discarded; the status line says
        so).
      truncated: false
    - text: A ring-shaped part would absorb other parts printed inside its hole
        (filled inside).
      truncated: false
    - text: A DPI override re-detects that page's parts and re-packs the layout (hand
        moves are lost, as for other edits).
      truncated: false
    - text: Images are flattened onto white; TIFF and PDF-in-folder are not loaded.
      truncated: false
    - text: Full-A4 frame sheets print edge to edge; printers without borderless
        printing may clip about 5 mm at the sheet edges (the user's choice).
      truncated: false
