  summary:
    text: "Round 6 (fixes the review's A7/A8 defects). A7: frame drags are measured
      from the press origin (frame position at press + pointer offset / scale),
      so frames follow the pointer exactly at any zoom. A8: list_images skips
      hidden files (macOS '._' forks, .DS_Store); the folder loader skips
      unreadable images (listed in the tab as 'Skipped N unreadable file(s): …',
      page indices stay consistent) and loads the rest; a folder with no
      readable image shows 'none of the images could be read'; pages loaded
      before an error stay visible. From the review's risks: a file DPI that
      would make a page larger than A0 is ignored (assumed A3, said so), a DPI
      override that large is refused, the DPI field starts at 50; export PNGs
      are written under temporary names and renamed only on completion, so a
      cancel never touches an earlier export's files. New tests:
      zoomed_frame_drags_follow_the_pointer (800 %, 40 half-point steps),
      unreadable_folder_images_are_skipped,
      a_cancelled_export_keeps_earlier_files, images unit tests for hidden files
      and the A0 guard. Responsiveness frame-time limits are asserted in release
      builds only (new check pdf-ui-release); the debug suite runs in parallel
      and its timings are not meaningful. Round 5 (user-requested changes, all
      confirmed): manual frames are full A4 (210 × 297 mm; layout::compose_frame
      fills the portrait sheet edge to edge; Frame::size = sheet_px), the first
      frame on a page is turned to match it (rotated when the page is taller
      than wide) so two frames tile an A3 page; the page view zooms (− / + /
      Fit, 100–800 %, Cmd+scroll or pinch via egui zoom delta while hovering,
      ScrollArea both ways). Round 4. (1) Export no longer freezes the app (user
      report): layout::write_export builds the PDF one sheet at a time
      (PdfBuilder) with progress and cancel, writing to a temporary file renamed
      at the end (cancel removes PNGs written so far); PartsTab::start_export
      runs it on a worker with its own copies of the layout and the frame pages;
      the toolbar shows a progress bar 'Exporting sheet i of n' and Cancel
      Export; status reports the result. (2) A8 image folders (user request):
      File ▸ Open Folder of Images… → list_images (png/jpg/jpeg/bmp/webp,
      natural order), load_page (DPI from PNG pHYs / JPEG JFIF, else full A3 by
      shape, resampled to 300 dpi, transparency on white) on a worker; page
      header shows 'W × H mm (from file DPI | assumed A3 | N dpi set by you)', a
      DPI field and Apply DPI, which reloads that page on a worker and
      re-detects its parts; empty folder → 'No images in …'. (3) On-screen
      previews are capped at 2048 px per side (large or re-scaled pages exceeded
      GPU texture limits). Earlier rounds: Round 3 (fixes the review's A2
      defect). PartsTab::proposal_at now uses masks only (no bounding-box
      fallback): empty paper inside a concave/tapered part's box is no part, so
      a click there selects nothing and a MobileSAM refine there adds a new part
      instead of replacing the neighbour. Also from the review's risks: export
      skips packed sheets without parts (no blank first page when every page is
      manual); set_manual deselects the page's now-hidden proposals; the app
      refreshes sam_ready every frame (MobileSAM installed later enables
      Refine); the debug-build responsiveness test allows 500 ms per frame
      (release keeps 250 ms). New tests:
      empty_paper_beside_a_tapered_part_is_not_that_part,
      all_manual_pages_export_only_frames. Round 2 (fixes the review's A2 defect
      and adds the user's update). A2: detect() fills everything enclosed by a
      part's outline (fill_holes) and merges proposals lying ≥90 % inside a
      larger part's mask (absorb_enclosed), so an unfilled (white) part owns its
      inside and the number printed in it; PartsTab::proposal_at picks the
      smallest proposal whose mask (else box) contains the point, used for
      clicks and MobileSAM refine (a refine inside an unfilled part replaces
      it). Fixture: page 2 gains an unfilled 70 × 45 mm part '27' with its
      number in the middle. Split: split::GlueOn {Smaller, First, Second}; the
      Split window labels the pieces 1/2 beside the line and offers 'Strip on:
      Smaller piece / Piece 1 / Piece 2'. A7 manual decompose (user update,
      confirmed): per page 'Manual (A4 frames)' checkbox; manual pages' parts
      leave the layout (rebuild filters them; unmarking brings them back); Frame
      {page, x, y, rotated} = the 200 × 287 mm printable area at true scale; Add
      Frame (top-left, then beside the last frame / next row), Rotate Frame,
      Remove Frame, drag to move, overlap allowed, past-the-page = white;
      layout::compose_frame puts the framed area into the printable area of a
      portrait A4 sheet (landscape frames turned 90° clockwise); export = packed
      sheets then frame sheets (page, then creation order) via
      layout::export_sheets; status line counts frame sheets; edits that re-pack
      say 'Parts changed: the sheets were re-packed'. Round 1: PDF parts → A4.
      src/pdf/: pdfium.rs (pdfium-binaries chromium/7881 archive per arch,
      SHA-256 pinned as a ModelSet; install_from_archive re-verifies and
      extracts lib/libpdfium.dylib; default dir <app data>/Game Asset
      Creator/pdfium, GAC_PDFIUM_DIR overrides; one process-wide binding),
      render.rs (page_count, render_page at 300 dpi on white, page size in mm),
      parts.rs (paper colour = mode of a sparse quantized sample; ink = channel
      difference > 30; square closing by 1.5 mm via separable running counts;
      parts = components of the grown mask keeping their closed/ink pixels; < 4
      mm² dropped; merge; from_page_mask for MobileSAM), pack.rs (A4 portrait
      printable 200 × 287 mm, 5 mm margin, 2 mm spacing; max-rects
      best-short-side-fit with 0°/90°, largest first, earlier sheets first;
      fits/valid/shelf_sheets bound), split.rs (straight cut, smaller piece gets
      a glue strip 0–20 mm (default 8) copied from the other side with an outer
      outline and a dashed fold line on the cut; red alignment ticks across the
      cut every 20 mm, at least two, drawn only over piece pixels), layout.rs
      (items/placements/sheets; repack, move_item, move_item_near (snap within a
      radius, clamped), rotate, unplace, add/remove sheet, split → two tray
      pieces, place_tray, compose A4 at 300 dpi, export one PDF via pdf-writer
      with Flate RGB images drawn at exactly 300 dpi plus optional PNGs).
      parts_ui.rs: Parts Layout tab (worker thread renders, detects, and cuts
      out parts with previews; progress line; toolbar Merge/Delete/Refine
      (MobileSAM)/Re-pack/Add Sheet/Remove Empty Sheets/Place Tray Items/Rotate
      90°/To Tray/Split…/Also PNGs/Export A4 Pages…; oversize warnings 'Part X
      does not fit on A4: W × H mm'; pages with outlined numbered proposals
      (click/Cmd-click select, refine clicks); sheets with draggable parts (grab
      from press origin, drop snaps within 3 mm, refusal message); tray; Split
      window with drawn line and glue slider). ui.rs: File ▸ Open (and dialog
      filter) accepts .pdf → open_pdf; PDFium consent window + download
      (models::Download, then install) and progress; failure keeps the app
      usable; PdfConfig (dir/source) for tests; MobileSAM refine routes
      segmenter masks to the tab. Fixtures tests/fixtures/pdf: generated A3
      sheets (portrait page with 12 parts, landscape page with a 340 × 75 mm
      wing, a 260 × 35 spine, 5 more parts) + json truth + generate.py +
      LICENSE.txt."
    truncated: false
