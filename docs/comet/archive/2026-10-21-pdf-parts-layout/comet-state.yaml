          a_folder_of_page_images_opens_like_a_pdf (PNG 300 dpi + JPEG without
          DPI + txt; natural order; sizes; every fixture part found; Apply DPI
          150 doubles page and parts; empty folder message); unit tests
          pdf::images (order, DPI from PNG/JPEG, A3 fallback, override) and
          preview size cap. New/changed: parts unit test for an unfilled part
          with an inner label; fixture tests now 20 parts (12 + 8) with part 27
          found as one proposal; layout
          frame_sheets_hold_exactly_the_framed_area; split
          the_glue_strip_goes_on_the_chosen_piece; pdf_ui: Split window with
          'Piece 2' chosen (strip on piece 2),
          manual_pages_export_their_a4_frames (UI checkbox, Add Frame, drag,
          Rotate Frame, export renders back equal to compose_frame, overlap,
          unmark), clicks_inside_an_unfilled_part_select_it, MobileSAM refine
          inside part 27 replaces it."
        truncated: false
