acceptance:
  - id: A1
    source: brief.md
    text: "A1: File ▸ Open of a PDF asks before downloading PDFium the first time
      (SHA-256 checked, progress, failure keeps the app usable), then opens a
      Parts Layout tab with every page rendered at 300 dpi and its size in mm
      shown (A3 = 297 × 420 mm)."
    result: passed
    reason:
      text: I re-ran the consent probe as a separate process. Nothing downloads before
        consent. Cancel declines. A failing source shows 'PDFium could not be
        installed' and the app stays usable. A good Directory source installs
        libpdfium.dylib and opens the waiting PDF. Pages render at 300 dpi
        (3508x4961 = 297x420 mm, 4961x3508 = 420x297 mm) and their sizes are
        shown. The repo pdf_ui consent and open tests pass.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: On the fixture sheets, part detection finds every model part (each
      known part rectangle matched by one proposal within 2 mm, part numbers and
      tabs inside their part — also for unfilled (white) parts with a number
      printed inside, whose inside is part of the part) and nothing else except
      proposals the user can delete (title block); a click selects the innermost
      proposal under it; the user can merge two proposals, delete one, and (with
      MobileSAM installed) click to add or refine a part (a click inside a part,
      filled or not, replaces it)."
    result: passed
    reason:
      text: The detect, white/tan, nested and L-notch probes give the same results as
        before. Every known rectangle is matched within 2 mm on white and tan
        sheets. Clicks select the innermost proposal, and a click in the notch
        selects nothing. Cmd-select and Merge work, and deleting the title
        works. The repo MobileSAM refine test (inside a white part) passes.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Auto-pack places all parts that fit onto A4 sheets at exactly their
      printed size (mm), within 5 mm margins, at least 2 mm apart, never
      overlapping, rotated only by 90°, using no more sheets than a simple shelf
      packing would; parts can be dragged within and between sheets, rotated
      90°, and the sheets re-packed; illegal placements (overlap or outside the
      margin) are refused or flagged."
    result: passed
    reason:
      text: "Pack probe: 600 random cases, none worse than shelf packing, all within
        margins, spacing and no overlap, rotations of 0 and 90 only, worst 2.05
        ms. Of 3000 random moves, 1279 legal ones were accepted and 1721 illegal
        ones refused. The repo drag, rotate and repack UI tests pass."
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: A part larger than A4's printable area in both orientations is not
      placed; the tab shows a warning naming it and its size; the user draws a
      straight cut line across it; the result is two pieces with an 8 mm glue
      strip (configurable 0–20 mm) on one and alignment marks on both; pieces
      that still do not fit are flagged again; after splitting, every piece can
      be placed."
    result: passed
    reason:
      text: "The Split-window probe shows the warning 'Part 2.22 does not fit on A4:
        340 x 75 mm'. With a 12 mm strip on Piece 1 the piece is 238.9 mm, which
        is cut + 12 mm, and marks appear on both pieces. After a diagonal
        re-split the status reads 'All parts fit on A4' and everything is
        placed."
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Export A4 Pages… writes one A4 PDF (210 × 297 mm pages, 300 dpi
      images) with one page per sheet; printed at 100 % every part has its
      original size (verified by measuring the exported pages: ±0.5 mm);
      optional PNGs per page."
    result: passed
    reason:
      text: Export pages are 210x297 mm with one 2480x3508 image each. The worst
        printed-size error against the items is 0.085 mm. PNGs are written per
        sheet.
      truncated: false
  - id: A6
    source: brief.md
    text: 'A7: A page can be marked "Manual (A4 frames)" in the tab: its parts leave
      the layout; A4 frames (full A4, 210 × 297 mm, shown at true scale on the
      page; the first frame is turned to match the page so that two frames tile
      an A3 page exactly) can be added, removed, dragged freely, and turned 90°,
      and may overlap; the page view zooms in (buttons and Cmd+scroll) for
      placing them; Export A4 Pages… adds one portrait A4 sheet per frame after
      the packed sheets, filled edge to edge with exactly the framed page area
      at true scale (±0.5 mm), turned 90° for landscape frames; unmarking the
      page brings its parts back into the layout.'
    result: passed
    reason:
      text: "Release bench: render 142 ms, detect 264 ms, pack 100 parts 0 ms. Release
        perf probe on 6 pages and 288 parts: open returns in under 0.2 ms, load
        takes about 2 s on a worker, p95 frame 0.2-0.36 ms, worst frame 38-147
        ms across 3 runs. During export, start returns in 7 ms and the worst UI
        frame is 0.38 ms. The release pdf_ui suite passes 20/20."
      truncated: false
  - id: A7
    source: brief.md
    text: "A8: File ▸ Open Folder of Images… opens a folder's images (PNG, JPEG,
      BMP, WebP; other files ignored; natural name order, e.g. page2 before
      page10) as one Parts Layout tab without blocking the UI; a 300-dpi
      PNG/JPEG scan of an A3 sheet gets its size from the file (297 × 420 mm ± 1
      mm) and yields the same parts as the PDF page; an image without DPI is
      taken as A3 by its shape; each image page shows \"W × H mm (from file DPI
      | assumed A3)\" and a DPI override that re-scales the page and re-detects
      its parts in the background; an empty folder shows a message."
    result: passed
    reason:
      text: "The frame-drag defect is fixed. My drag probe tested zoom
        100/125/200/300/500/800 % with slow drags (0.1 pt per frame over 300-400
        frames), fast drags (2 steps of 100+ pt), and x, y, diagonal and
        negative directions. Every final frame position is within 0.48 px (0.04
        mm) of pointer delta / scale. The pointer-to-frame screen offset drifts
        at most 0.66 pt. A slow out-and-back drag at 800 % returns exactly to
        (500,500). The rest of A7 still holds: full-A4 frames, the first frame
        turned to match the page so two frames tile A3, zoom with +/-/Fit,
        Cmd+scroll and pinch clamped to 100-800 %, and unmarking a page brings
        its parts back. Frame export: 7 files, 0.38 s, with progress and
        Cancel."
      truncated: false
  - id: A8
    source: brief.md
    text: "A6: Rendering an A3 page takes under 2 s, detection on a page under 2 s,
      and auto-pack of 100 parts under 1 s in a release build; the UI stays
      responsive (work on worker threads with progress)."
    result: passed
    reason:
      text: "The defect where one bad file aborted a folder is fixed. Folder with ._
        files, .DS_Store, .hidden.png, a truncated PNG, a zero-byte WebP, a
        truncated JPEG, a garbage BMP and a chmod-000 PNG: the 5 good images
        load in natural order. The 5 bad ones are listed in 'Skipped 5
        unreadable file(s): …'. Page indices stay consistent: each page's part
        count and size equal a fresh load+detect of that file. DPI Apply on the
        last page reloads the right file (p10.png). An all-unreadable folder
        shows 'none of the images could be read' with no hang. A folder of
        hidden files only shows 'No images in …' and opens no tab. Guards: a
        file DPI of 25 or 100 that would exceed A0 gives assumed A3, explained
        in the header. A DPI below 20 is ignored and the page is taken as A3. A
        50-dpi override (2520 mm) is refused with the page unchanged. Natural
        order, sizes (300/150 dpi gives 297x420 mm ±0.1 mm), the same parts as
        the PDF (16/16 and 13/13 within 1 mm) and loading off the UI thread all
        hold again."
      truncated: false
