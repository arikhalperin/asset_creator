acceptance:
  - id: A1
    source: brief.md
    text: "A1: `cargo build` builds the project from `Cargo.toml` (library +
      `game-asset-creator` binary), and `cargo test` runs and passes from the
      repository root."
    result: passed
    reason:
      text: Cargo.toml defines lib game_asset_creator and [[bin]] game-asset-creator
        (edition 2021; eframe/egui 0.36, egui_dock 0.21, image, png, rfd).
        Runtime checks cargo test, clippy -D warnings, fmt --check all passed;
        cargo build re-run by verifier finished cleanly.
      truncated: false
  - id: A2
    source: brief.md
    text: 'A2: `cargo run` (the `game-asset-creator` binary) opens the main window
      titled "Game Asset Creator".'
    result: passed
    reason:
      text: main.rs calls eframe::run_native(APP_TITLE, ...) with
        ViewportBuilder::with_title(APP_TITLE) where APP_TITLE = "Game Asset
        Creator" (asserted by tests/app.rs title_constant). Verifier launched
        target/debug/game-asset-creator and the process stayed alive for 6s
        before being killed; Builder reports a screenshot of the titled window.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: The main window shows three dockable panels — Tools, Layers, Asset
      Library — that can be dragged/re-docked and closed, plus a View menu that
      shows/hides each one; documents appear as closable tabs in the document
      area."
    result: passed
    reason:
      text: default_layout puts Tools, Layers, Asset Library panel tabs and an empty
        document leaf in an egui_dock DockState; DockArea uses default
        draggable/closeable tabs. View menu has a checkbox per Panel driving
        set_panel_open (remove_tab / re-append without duplicates; tested by
        panels_can_be_hidden_and_restored). Document tabs close via
        TabViewer::on_close -> forget_document, and via Close.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: File → Open… accepts PNG, JPG/JPEG, BMP, and WebP; opening a file
      adds a new document tab named after the file that shows the image pixels,
      and focuses it. An unreadable or unsupported file shows an error message
      and adds no tab."
    result: passed
    reason:
      text: Open uses rfd dialog filtered to png/jpg/jpeg/bmp/webp; open_path ->
        AppState::open -> load_document, adds tab named after file, appends to
        doc leaf, sets active and focused node and current doc (tests
        opening_an_image_adds_a_focused_tab, second-image test). Corrupt,
        missing, and unsupported (.tga) files set an error shown in an Error
        window and add no tab (failed_open_shows_error_and_adds_no_tab).
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: File → New… asks for width, height, and DPI and opens a new tab
      containing a fully transparent single-layer document of that size; invalid
      (zero/non-numeric) values are rejected."
    result: passed
    reason:
      text: New dialog with width/height/DPI fields defaulting 512/512/72; parse
        rejects zero, non-numeric, negative, >16384 sides and
        non-positive/non-finite DPI with an inline error keeping the dialog
        open; valid input creates Untitled-N transparent single-layer doc in a
        focused tab (new_document_dialog_* tests).
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: File → Export… writes the current document to PNG, JPG, BMP, or WebP
      by chosen extension, compositing visible layers; exporting an opened PNG
      to PNG reproduces identical RGBA pixel values (verified by automated test
      through the same app export path the menu uses)."
    result: passed
    reason:
      text: Menu Export calls EditorApp::export_to (same path as tests) ->
        export_document which composites visible layers and encodes by extension
        for png/jpg/jpeg/bmp/webp; export_round_trips_png_pixels_exactly
        verifies identical RGBA through export_to; unsupported extension errors
        before creating a file; Export menu item disabled without a document;
        Ctrl+Shift+E bound.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: JPG and BMP export composite transparent pixels over white; PNG and
      WebP keep alpha (WebP lossless). DPI is written to PNG (pHYs) and JPG
      (JFIF density)."
    result: passed
    reason:
      text: JPEG (quality 95) and BMP use flatten_on_white and RGB8; PNG writes RGBA8
        via png crate with pHYs in px/m from DPI; WebP uses
        WebPEncoder::new_lossless RGBA8; JPEG sets PixelDensity in inches. Tests
        cover over-white compositing, alpha preservation for PNG/WebP, and DPI
        round-trip 300/72 PNG and 150 JPG.
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: Loading reads every supported format into a document with one RGBA8
      layer of the image's size, records the source path and name, and reads DPI
      from PNG pHYs / JPG JFIF density (72 when absent or for BMP/WebP)."
    result: passed
    reason:
      text: load_document validates extension, decodes via image crate, into_rgba8,
        creates one Background layer of image size, sets name to file name and
        source_path; DPI from PNG pHYs (meter unit only) and JFIF APP0 density
        (inch or cm converted), else 72; BMP/WebP 72. Tested for all formats
        incl. .JPEG case, cm conversion, and defaults.
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: The Layers panel lists the current document's layers top-first with a
      visibility indicator and follows the focused document tab (empty state
      when no document); the Tools panel shows disabled placeholder tool
      buttons; the Asset Library panel shows placeholder text."
    result: passed
    reason:
      text: layers_panel renders AppState::current_layer_rows (reversed = top-first)
        with eye/dash visibility indicator, or 'No document' when none; current
        doc is updated each frame from dock find_active_focused document tab and
        on close falls back to remaining doc. Tools panel shows disabled
        Move/Select/Brush/Eraser/Fill/Picker buttons; Asset Library shows
        placeholder text. Status bar shows name, size, DPI or 'No document'.
      truncated: false
  - id: A10
    source: brief.md
    text: "A10: Unit tests cover the document model: construction and validation of
      size/DPI, layer buffer size invariants, add/insert/remove/move layer
      ordering, and compositing of visible layers with opacity."
    result: passed
    reason:
      text: document.rs unit tests cover construction/metadata, zero size and invalid
        DPI rejection (incl. NaN/inf and set_dpi), layer size mismatch rejection
        leaving stack unchanged, add/insert/remove/move ordering with
        out-of-range errors, opacity clamping, and compositing (single layer
        exact, hidden/zero-opacity excluded, opacity blend, translucent alpha
        combine, empty transparent).
      truncated: false
