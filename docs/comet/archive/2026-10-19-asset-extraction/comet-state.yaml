acceptance:
  - id: A1
    source: brief.md
    text: 'A1: Extract → Remove Background… opens a preview dialog: Background color
      (auto: the most common border color; or picked by clicking the canvas),
      Tolerance (default 10 %), Edge Softness (default 10 %), Contiguous
      (default on), Preview; OK records one undo step "Remove Background" on the
      active layer (through the selection), Cancel restores exactly. On the flat
      and near-flat fixture sheets every background pixel becomes fully
      transparent, sprite interiors keep their exact pixels, and anti-aliased
      edge pixels become partially transparent with the background color removed
      from their color.'
    result: passed
    reason:
      text: "Extract menu -> Remove Background... opens RemoveBackgroundDialog (Auto
        dominant border color quantized 5 bit + mean, Pick via canvas click,
        Tolerance 10, Edge Softness 10, Contiguous on, Preview, Reset, OK,
        Cancel) implemented as a hidden filter through
        begin/preview/commit/cancel_filter (selection-aware). extract_ui test
        remove_background_previews_picks_and_commits_one_step passes: live
        preview keys bg, Preview off restores original, Pick samples clicked
        color, Cancel restores byte-exact, OK adds exactly one undo step
        labelled 'Remove Background', undo restores. tests/extract.rs
        remove_background_clears_background_and_keeps_sprites passes on flat and
        near-flat sheets against a coverage ground truth: every bg pixel alpha
        0, interiors unchanged, >=100 soft edge pixels all partially transparent
        and decontaminated."
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Extract → Auto-Detect Objects… finds the objects in the active layer
      (keying the background automatically, without changing the layer, when it
      has no transparency) and shows them as numbered boxes on the canvas and a
      checklist with Minimum Size (default 16 px²) and Merge Distance (default 2
      px); on every fixture sprite sheet (flat, near-flat, transparent) it
      proposes exactly one box per sprite with the ground-truth bounds (exact;
      ±1 px on the near-flat sheet), keeping detached parts within the merge
      distance together; Add to Library adds the checked proposals."
    result: passed
    reason:
      text: AutoDetectDialog keys with KeyParams::auto when the layer is fully opaque
        (copy, layer untouched - asserted in UI test), 8-connected labelling,
        bbox-gap merge (default 2 px), Min Size 16;
        auto_detect_finds_every_sprite_with_exact_bounds (flat + transparent,
        exact) and auto_detect_on_a_near_flat_background_is_within_one_pixel
        pass with count == sprite count; UI test shows 'N objects found, N
        selected', numbered canvas boxes, unchecking 2 adds N-2 assets. Unit
        test covers merging detached parts and dropping specks.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: The Extract Object tool (Tools panel, shortcut O) segments the object
      under a click, inside a dragged box, or refined by Shift-click (include) /
      Option-click (exclude) points on the active layer; the mask shows as a
      tinted overlay; Add to Library (Enter), To Selection, and Clear (Esc) are
      in the tool options; segmentation runs in the background (the UI stays
      responsive) and the tool options show which engine produced the mask."
    result: passed
    reason:
      text: "Tool::ExtractObject in Tools panel with shortcut O; canvas emits
        ExtractPoint (Replace / Shift Include / Alt Exclude) and ExtractBox on
        drag; tinted mask overlay + point/box markers drawn; tool options strip
        shows engine status and Add to Library (Enter), To Selection, Clear
        (Esc), Download Model.... Segmentation runs on the 'segmenter' worker
        thread (newest request wins). UI test
        extract_object_with_grabcut_click_box_points_and_accept passes (click,
        shift/alt points, box, Enter, Esc, undoable To Selection, 'GrabCut -
        ONNX Runtime not found' shown). Own probe: extract_prompt returned in
        0.1 ms and the worst frame while MobileSAM encoded was 1.0 ms."
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Click-to-extract on each fixture photo returns a clean mask — IoU ≥
      0.90 with the ground truth, one connected region, no holes or islands
      larger than 0.5 % of the object — with MobileSAM and with the GrabCut
      fallback."
    result: passed
    reason:
      text: "extract.rs grabcut_click_returns_a_clean_mask_on_every_photo and
        mobilesam_click_returns_a_clean_mask_on_every_photo pass (MobileSAM ran
        with GAC_MODEL_DIR set - no 'skipped' line). Independent probe on all 3
        fixtures with given + alternate interior clicks: GrabCut IoU potion
        0.905, chalice 0.960-0.961, skull 0.980; MobileSAM potion 0.904-0.905,
        chalice 0.993, skull 0.997; all exactly one region; hole/island check
        enforced by assert_clean."
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Models load lazily and degrade gracefully: nothing ML-related loads
      before the first Extract Object; without ONNX Runtime or the models the
      tool uses GrabCut and says why; the first use asks before downloading the
      MobileSAM models (~45 MB) into the app's data folder in the background
      with progress; files are SHA-256 checked; declining, a failed download, or
      a corrupt file leaves GrabCut in use (no partial file is used) and later
      extractions switch to MobileSAM once the models are ready."
    result: passed
    reason:
      text: "Probe: sam::runtime_loaded()=false and segmenter not started after
        opening a doc, selecting the tool, and running Auto-Detect; loads only
        after first prompt. Without runtime -> Availability::Unavailable with
        reason shown and GrabCut used (UI test). Missing models -> consent
        'Download MobileSAM?' (Download / Use GrabCut) while GrabCut answers;
        download on background thread with progress ('Downloading MobileSAM... n
        %'), writes .part, SHA-256 verifies, renames. Damaged-source download:
        UI test asserts error shown, model dir empty, GrabCut still used; probe
        with truncated second file left only the verified first file, no .part.
        Probe with same-size corrupted models: NeedsModels('...damaged (checksum
        mismatch)'), GrabCut used, decline keeps GrabCut, then Download
        re-fetches and the next prompt uses MobileSAM (verify Ok).
        downloaded_models_switch_extract_object_to_mobilesam passes with
        GAC_MODEL_SOURCE."
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: Every asset — from Auto-Detect, Extract Object, or Add Selection to
      Library — is a tight transparent crop: its size is the bounding box of its
      non-transparent pixels, pixels outside the extraction are fully
      transparent (partial mask coverage scales alpha), and its saved PNG is
      RGBA and reloads identical."
    result: passed
    reason:
      text: "All three paths use extract::tight_crop/tight_crop_region (alpha *=
        coverage rounded, crop to alpha>0 bbox, empty -> not added).
        every_extraction_is_a_tight_transparent_crop passes (Auto-Detect rects
        == proposal rects, PNG reloads as Rgba8 identical; GrabCut asset tight
        with transparent outside). UI test: Add Selection crop of a circle
        equals the detected asset (same rect and pixels). Probe:
        partial-coverage mask gives alpha round(180*c/255) exactly (7, 169) with
        rect excluding zero-coverage column; Extract Object accept via app
        produced a tight 190x241 asset."
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: The Asset Library panel lists assets (thumbnail, name `<document>
      <n>`, size) in the order added; Save PNG… saves the selected asset, Save
      All… writes every asset into a chosen folder with unique file names, Open
      as Document opens it as a new image document, Remove deletes selected
      assets; the library lasts for the session and is available through the
      `AssetLibrary` API (name, image, source document, source rectangle)."
    result: passed
    reason:
      text: asset_library_panel lists in insertion order with 48 px thumbnail, name
        '<stem> <n>', 'w x h'; click / Cmd toggle / Shift range selection; Save
        PNG... (single selection, rfd dialog -> save_png RGBA), Save All...
        (folder, unique ' (2)' names, never overwrites existing files - unit
        test), Open as Document (new image document named after the asset),
        Remove. AssetLibrary API exposes id, name, image, source, rect.
        asset_library_panel_saves_opens_and_removes and
        names_count_per_document_and_save_all_dedupes pass. Library is
        session-only (in AppState).
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: Release benchmarks: Remove Background preview on 1920×1080 < 150 ms;
      Auto-Detect on a 2048×2048 sheet < 250 ms; GrabCut mask on 1920×1080 < 2
      s; MobileSAM first mask on an image < 2 s and later masks on the same
      image < 200 ms."
    result: passed
    reason:
      text: "cargo test --release --test extract -- --ignored with models: Remove
        Background preview 1080p 26.2 ms (<150), Auto-Detect 2048x2048 19.5 ms
        (<250), GrabCut 1080p 99 ms (<2000), MobileSAM first 432 ms (<2000),
        later 49 ms (<200); assertions enforced in release. Second run
        25.9/18.0/100/421/50 ms. Own probe: Auto-Detect including keying on an
        opaque 2048x2048 sheet 55-60 ms. All other release benches pass (cargo
        test --release -- --ignored exit 0)."
      truncated: false
builder_handoff:
  candidate_id: 857a28db-7d23-4268-b6da-5cb13f659f16
  identity_provider: skill-coordinated
  builder_execution_ref: skill-coordinated:builder:157b2be5-d19a-49b9-b9ab-5f2f9ef3fe02
  iteration: 1
  summary:
    text: "Asset extraction engine. src/extract/: keying.rs (dominant border colour,
      max-channel distance, tolerance/softness alpha with colour
      decontamination, contiguous flood from the border; RemoveBackground as a
      hidden Filter so it reuses the filter preview/selection/undo path),
      detect.rs (8-connected labelling, box-gap merging, min size, tight bounds,
      ordered proposals), grabcut.rs (5-component GMMs, contrast-sensitive
      8-neighbour smoothness, work size 512 px, full-res border refinement;
      click prompts try a region-grown box with region-initialised models, then
      squares, picking the smallest box whose object does not touch its edges),
      maxflow.rs (Boykov-Kolmogorov, brute-force tested), sam.rs (ONNX Runtime
      loaded dynamically via ort load-dynamic from ORT_DYLIB_PATH/Homebrew
      paths; encoder at 1024 px, single-mask decoder with points/box), models.rs
      (MobileSAM files with pinned SHA-256 and sizes; background download to
      .part, verify, rename; Source Http or Directory), segment.rs (Prompt;
      Segmenter worker created on first prompt, latest request wins, embedding
      cache per document/layer/undo state, Availability
      Ready/NeedsModels/Unavailable, GrabCut fallback), mod.rs (tight_crop,
      clean_mask). src/asset_library.rs (session AssetLibrary, '<stem> <n>'
      names, save_all with unique names). src/extract_ui.rs (Remove Background
      dialog with Auto/Pick, Auto-Detect dialog with checklist and canvas boxes,
      ExtractSession with mask overlay and points, Asset Library panel). ui.rs:
      Extract menu (Remove Background..., Auto-Detect Objects..., Add Selection
      to Library), Extract Object tool (O; click/box/Shift include/Option
      exclude; Enter add, Esc clear; tool options show engine status, Add to
      Library, To Selection, Clear, Download Model...), consent window, download
      progress/errors, Asset Library panel actions. Fixtures:
      tests/fixtures/extract (generated by tests/extract_fixtures.rs with
      UPDATE_FIXTURES=1): flat/near-flat/transparent sprite sheets with
      ground-truth bounds and coverage, three synthetic photos with ground-truth
      masks. Spec: GrabCut click-prompt description updated to match the
      implementation (the disk-only initialisation did not work)."
    truncated: false
  addressed_acceptance_ids:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    - A8
  checks:
    - name:
        text: cargo test
        truncated: false
      result: passed
      note:
        text: "288 tests incl. tests/extract.rs (exact sprite bounds on flat/transparent
          sheets, +-1 on near-flat, Remove Background vs coverage map, GrabCut
          and MobileSAM click masks IoU>=0.9/one region/no holes, tight
          transparent crops with PNG round trip) and tests/extract_ui.rs (7:
          remove background preview/pick/cancel/OK/undo, auto-detect add,
          Extract Object click/points/box/selection/accept/clear with GrabCut,
          consent + damaged download keeps GrabCut, real download switches to
          MobileSAM when GAC_MODEL_SOURCE is set, asset library
          save/open/remove, menu enablement). Without
          GAC_MODEL_DIR/GAC_MODEL_SOURCE the two MobileSAM-dependent tests
          report 'skipped'; the extract-sam check sets them."
        truncated: false
    - name:
        text: clippy -D warnings
        truncated: false
      result: passed
      note: null
    - name:
        text: fmt --check
        truncated: false
      result: passed
      note: null
    - name:
        text: release benchmarks
        truncated: false
      result: passed
      note:
        text: remove background 25 ms, auto-detect 2048^2 18 ms, GrabCut 1080p 99 ms,
          MobileSAM first 385 ms / later 46 ms; video, filters, canvas,
          transform unchanged.
        truncated: false
  checks_truncated: false
  known_limits:
    - text: "MobileSAM models are not in the repo; checks use the copy downloaded into
        the scratchpad (same files and SHA-256 as the app downloads). The user's
        app data folder has no models yet: the first Extract Object will ask to
        download."
      truncated: false
    - text: "GrabCut on the potion photo scores IoU 0.905 (threshold 0.90): the pale
        cork differs from the bottle colour; chalice 0.96, skull 0.98."
      truncated: false
    - text: ONNX Runtime was installed with Homebrew (user-approved) and is loaded at
        run time; without it the app uses GrabCut.
      truncated: false
    - text: Auto-Detect runs synchronously when the dialog opens or its parameters
        change (18 ms on 2048x2048).
      truncated: false
  known_limits_truncated: false
