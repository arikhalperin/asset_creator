  summary:
    text: All acceptance items A1-A8 pass. cargo test (all suites) passes; MobileSAM
      fixture and download->MobileSAM UI tests actually ran with the local
      models; clippy -D warnings and fmt --check are clean; release benchmarks
      are far inside the A8 limits (RB 26 ms, AD 19 ms, GrabCut 99 ms, SAM first
      432 ms / later 49 ms). Independent probes confirmed lazy loading (runtime
      not loaded before the first prompt), non-blocking UI (<=1 ms frames during
      encoding), exact alpha scaling and tight crops, corrupt/truncated download
      handling with GrabCut fallback and later switch to MobileSAM, and fixture
      IoUs with alternate click points. Main risk is the thin IoU margin on the
      potion fixture and GrabCut click robustness on harder images.
    truncated: false
  risks:
    - text: "Potion fixture IoU margin is thin for both engines (GrabCut 0.905,
        MobileSAM 0.904-0.905 vs 0.90 threshold): a body click never includes
        the differently coloured neck, so small fixture or algorithm changes
        could flip A4."
      truncated: false
    - text: "GrabCut click robustness beyond the fixtures is limited: on an
        independent synthetic striped object with a cast shadow (800x600) a
        click gave IoU 0.80 (box prompt 1.00; MobileSAM 0.99); a click on the
        exact object edge of the chalice gave IoU 0.01."
      truncated: false
    - text: The A8 Auto-Detect benchmark times detection on an already-transparent
        sheet (keying excluded); measured independently with keying on an opaque
        2048x2048 sheet it is still ~60 ms, well under the limit.
      truncated: false
    - text: Spec says the mask overlay has an outline; only the tinted fill plus
        point/box markers are drawn (A3 only requires the tint).
      truncated: false
    - text: "Remove Background preview and Auto-Detect keying/detection run
        synchronously on the UI thread (permitted: the constraint covers
        segmentation/model/download only; they take <60 ms on large images)."
      truncated: false
    - text: "Download: if the final rename fails the .part file is not removed (rare);
        models::present checks sizes only, but SamModel::load SHA-verifies
        before use so damaged files are never used."
      truncated: false
    - text: Save PNG.../Save All... file dialogs (rfd) are not exercised headlessly;
        the underlying save_asset_to/save_all_assets_to are tested.
      truncated: false
  risks_truncated: false
  completed_at: 2026-10-19T09:02:24.762Z
