acceptance:
  - id: A1
    source: brief.md
    text: "A1: On the fixture sheets the palette lists every paint colour (each
      known paint colour matched by one swatch within ΔE 8), with paper, black
      ink, and the white insignia not offered as paint swatches unless they
      cover painted area; detection takes under 2 s per A3 page (release)."
    result: passed
    reason:
      text: "tests/recolor.rs the_palette_holds_exactly_the_paints passes. Independent
        release probe on both fixture pages: exactly 4 swatches (olive, grey,
        sand, light blue), each within ΔE 0.03 of the known paint. Paper, black
        ink and the white star are not offered. The palette takes 83 ms per A3
        page (limit 2 s); bench-recolor log reports 83 ms."
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Mapping one swatch (e.g. olive → blue) changes exactly that paint: in
      its areas the base colour becomes the new colour (mean ΔE to the target
      under 5 away from markings), every other swatch, the paper, and the
      insignia are unchanged (ΔE < 1), on all pages."
    result: passed
    reason:
      text: "The new whole-page test mapping_each_paint_changes_only_that_paint
        passes. Independent release probe mapped each of the 4 paints to 6
        targets (blue, navy, very dark, light, red, magenta) at detail 0, 1 and
        1.5 on both pages. Results: 0 pixels changed by ΔE ≥ 1 outside that
        paint's panels; 0 paper or ink pixels changed; 0 of 203k white insignia
        pixels changed. Mean ΔE to the target over all plain-paint pixels away
        from markings is 0.00–0.24 (limit 5). The earlier failure (fringes on
        outlines and paper) is gone."
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Markings survive: the lightness contrast of rivets and panel lines
      against their surrounding paint is kept within 10 % at Detail 100 %,
      removed to under 10 % of the original at 0 %, and increased at 150 %; part
      joints/outlines stay dark."
    result: passed
    reason:
      text: "Release probe measured every rivet and panel line (300 on olive, 96 on
        each other paint). At Detail 100 % with targets that have room in
        lightness (blue, red, magenta, light), the contrast ratio stays between
        0.975 and 1.005. At 0 % it drops to 0.000. At 150 % it rises to about
        1.22–1.51. A profile across a part outline shows its ink core stays at
        L* 0 for every target and detail, so outlines stay dark. Fixture tests
        detail_strength_fades_or_boosts_markings and
        mapping_one_paint_keeps_everything_else_and_the_markings pass. Limit
        (see risks): for very dark targets, contrast is cut off at black."
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: In the Parts Layout tab, Protect (MobileSAM) outlines a clicked area
      (the insignia) and recolouring leaves every protected pixel exactly
      unchanged; protected areas show on the page and can be removed; without
      MobileSAM the control is disabled with a reason."
    result: passed
    reason:
      text: "protected_areas_are_never_recoloured (with GAC_MODEL_DIR) and
        protect_needs_mobilesam_and_says_so pass. Independent probe through the
        real widgets: clicking the 'Protect (MobileSAM)' toggle, then the star,
        gives a 106,652 px mask that matches the star's area. After a second
        protect click on the olive panel and an Apply mapping olive to red, 0
        protected pixels changed while the unprotected olive changed. A hatched
        overlay texture is drawn on the page. 'Clear Protected' removes the
        masks. Without the model the toggle is disabled, with hover text and the
        visible note 'Protect needs the MobileSAM model.'"
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Parts Layout Recolor…: the preview follows every change within 200 ms
      (release); Apply runs on a worker with progress while the UI stays
      responsive; afterwards parts keep their outlines and placements (no
      re-pack), Export A4 Pages… shows the new colours, and Revert restores the
      original pages exactly."
    result: passed
    reason:
      text: "Release probe preview frame times: colour change 33–46 ms, detail 31 ms,
        tolerance 46 ms (limit 200 ms). Apply starts on a 'recolor' worker; the
        click frame takes 4 ms and the 'Recolouring page i of n' progress bar is
        shown. The worst frame during Apply is 158 ms, on the completion frame
        when parts are re-cut. A full 2-page apply takes 0.71 s. The UI test
        confirms placements and proposal rects are unchanged (no re-pack), part
        images and the exported A4 PDF carry the new colour, and Revert to
        Original restores the pages exactly (byte-equal, also checked in the
        probe)."
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: Image ▸ Recolor Paint… on a document: palette of the active layer
      (within the selection when there is one), the same controls, live preview,
      Cancel restores, OK is one undo step, and pixels outside the selection are
      unchanged."
    result: passed
    reason:
      text: editor_recolor_paint_uses_the_selection_and_undo passes. It opens through
        the Image menu. The palette within the selection has only the olive
        swatch. The dialog shows the shared controls (swatch rows with picker,
        RGB, hex, Tolerance, Detail strength). The live preview changes the
        layer, Cancel restores it exactly, OK adds one undo step labelled
        'Recolor Paint', pixels outside the selection are byte-identical, and
        undo restores the layer.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: Applying a recolour to an A3 page at full resolution takes under 3 s
      (release)."
    result: passed
    reason:
      text: "Full-resolution apply on an A3 page (3508x4961) in release: bench-recolor
        log 271 ms; my probe 180–285 ms for every paint, target and detail
        combination (limit 3 s)."
      truncated: false
  - id: A8
    source: brief.md
    text: "A9: In the Parts Layout Recolor… window, Recolour Area mode: a rectangle
      (drag) and a lasso (Shift-drag) on page 1 limit recolouring — after
      mapping olive, olive inside the areas changes and olive outside them and
      on page 2 is unchanged (preview and Apply); the swatches offered are those
      inside the areas; areas show on the page; Clear Areas returns to
      whole-page recolouring."
    result: passed
    reason:
      text: "(Brief A9, Recolour Area.) drawn_areas_limit_the_recolour passes through
        real drags (rectangle plus Shift-lasso). Independent release probe: a
        rectangle over the sand panel alone gives a palette of only sand. A drag
        under 2 mm is ignored. With rectangle plus lasso areas, every swatch was
        mapped and applied: 1.425 M pixels changed on page 1, and only 2 changed
        pixels fell outside the area polygons. Both are edge pixels on the
        lasso's slanted sides, where pixel rounding differs. No plain olive
        pixel inside the areas stayed unchanged, and page 2 stayed
        byte-identical. Code review: the preview uses the same blocked mask;
        areas are drawn as outlines; Clear Areas recomputes the whole-page
        palette and keeps the olive mapping (asserted in the test)."
      truncated: false
  - id: A9
    source: brief.md
    text: "A10: Typing R, G, B values or a #RRGGBB hex code in a swatch row (both
      windows) sets that paint's new colour exactly and previews it; invalid hex
      is ignored without changing the colour; typing the paint's own colour
      leaves it unchanged."
    result: passed
    reason:
      text: "(Brief A10, RGB/hex entry.) typed_rgb_and_hex_set_the_new_colour passes
        in the Parts Layout window: hex, invalid hex ignored, R typed, and the
        paint's own hex gives unchanged. Independent probe of the editor Image ▸
        Recolor Paint… dialog through real widgets: typing #2846A0 into the hex
        box sets the target exactly and the layer previews it (ΔE 0.00). Invalid
        '#12345' is ignored. Typing G=200 into the DragValue gives [40,200,160],
        previewed at ΔE 0.10. Typing the paint's own hex sets the target to None
        and the layer returns byte-identical to the original."
      truncated: false
  - id: A10
    source: brief.md
    text: "A8: Right-click a PDF page in the Parts Layout tab ▸ Open Page in Editor
      opens a document with exactly that page's pixels; after Image ▸ Recolor
      Paint… (or any edit) there, Image ▸ Update Parts Layout Page replaces that
      page in the tab — the edited pixels appear on the page and in Export A4
      Pages…, parts keep their outlines and placements (no re-pack), other pages
      are unchanged, and Revert to Original restores the PDF render exactly; the
      command is disabled with a reason for unlinked documents, a closed tab, or
      a changed canvas size."
    result: passed
    reason:
      text: "(Brief A8, Open Page in Editor.)
        a_pdf_page_opens_in_the_editor_and_goes_back passes. It opens through a
        real right-click context menu. The document is named '<file> – page N'
        and its composite equals the page pixels exactly. After Recolor Paint,
        Image ▸ Update Parts Layout Page (menu click) puts the edit on the page,
        in the part images and in the exported A4 PDF. Page 2 is unchanged,
        placements are unchanged, and Revert to Original restores the PDF render
        exactly. Unlinked documents and closed tabs give reasons. Independent
        probe closed the canvas-size gap the builder noted: a linked document
        cropped to 1000x1000 gives blocker 'The canvas is 1000×1000 but the page
        is 3508×4961', the menu item is disabled, and clicking it leaves the
        page unchanged."
      truncated: false
