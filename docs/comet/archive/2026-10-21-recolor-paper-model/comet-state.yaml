  summary:
    text: "All 10 acceptance items pass. All 15 runtime check logs for candidate run
      69ba6b04 passed (cargo test, clippy, fmt, every release bench, the PDF UI
      release run, recolor UI release 8/8). Independent release probes confirm
      the earlier A2 failure is fixed: every paint mapped to 6 targets at 3
      detail levels changed nothing outside its panels, no paper, ink or
      insignia pixels changed, and plain paint lands within ΔE 0.24 of the
      target. Palette 83 ms and apply about 0.28 s per A3 page; preview frames ≤
      46 ms; Revert and Update Parts Layout Page restore and transfer pixels
      exactly. Through real widgets: RGB/hex entry in the editor dialog,
      MobileSAM protect of the insignia and Clear Protected, Recolour Area
      palette and masking, and the canvas-size blocker. Remaining risk: contrast
      is cut off at black for very dark targets."
    truncated: false
  risks:
    - text: "A3 marking contrast is cut off at black for dark targets. Examples: olive
        to navy (L* 18) keeps 0.79–0.89 of panel-line contrast; very dark
        targets keep 0.43–0.74 on light paints. Sand or light blue mapped to
        blue at 150 % leaves a few markings at 0.99x instead of boosted. This is
        a physical sRGB limit (the line would need L* < 0), not a membership
        bug, but A3's 10 % rule holds only for targets with room in lightness."
      truncated: false
    - text: The shading transfer differs from the spec formula. The spec says Lab(p')
        = Lab(n) + (Lab(p) − Lab(b)) × detail. The code adds the lightness
        difference but scales chroma by the pixel's chroma ratio, plus a
        hue-shift term. Plain paint and lightness are as specified; the spec
        text could be updated to match.
      truncated: false
    - text: "'Clear Protected' clears protection on all pages; the spec says it
        removes a page's protection."
