acceptance:
  - id: A1
    source: brief.md
    text: "R1: Remove Background and Auto-Detect previews run on workers: while one
      computes on a 2048 × 2048 layer, every UI frame stays under 50 ms
      (release); the final pixels and detected rectangles equal the synchronous
      results; changing a parameter mid-run discards the stale result; Cancel
      restores the layer at once."
    result: passed
    reason:
      text: "Remove Background now renders only on a PreviewJob worker. Results are
        tagged with a generation number and stale ones are dropped. OK applies a
        finished preview at once; otherwise it sets the commit flag, shows a
        spinner with 'Applying…' (OK disabled) and records one undo step when
        the worker finishes. This includes Preview off, which renders on a
        worker when OK is clicked. While rendering, the dialog shows a spinner
        with 'Working…'. Auto-Detect keys and detects on a worker: poll/busy,
        Add disabled while busy, stale parameters re-detect. Runtime check
        responsive-release passed (exit 0) and I re-ran it twice in a scratch
        copy: OK mid-render and Preview-off apply frames 22-29 ms, cancel call
        3.6 ms with next frame 17 ms, Auto-Detect proposals equal the
        synchronous ones. My own probes on a 2048x2048 sheet, per-frame times,
        both Canvas and Active-layer sources: Preview off + OK applied the exact
        synchronous pixels as 1 step (worst frame 25 ms). Cancel during
        'Applying…' restored at once; no step and no extra layer appeared after
        the worker finished (worst 21 ms). Settings changed after OK gave
        exactly 1 step with the newest settings (worst 27 ms). OK clicked in the
        UI mid-render: every frame < 30 ms. The in-dialog Source switch frames
        were at most 29 ms. The open frame (open + render) was 22-31 ms warm and
        45-50 ms cold for the Canvas source. Auto-Detect open + frame < 20 ms."
      truncated: false
  - id: A2
    source: brief.md
    text: "R2: Extract Assets on a 1-minute clip: progress rises steadily to
      completion, every UI frame during the run stays under 50 ms (release), and
      Cancel ends the run within 1 s with the cancelling frame also under 50
      ms."
    result: passed
    reason:
      text: "tests/fixtures/video/minute.mp4 is 60.07 s, 640x360, 1802 frames.
        bench_extract_assets_on_a_minute_keeps_the_ui_responsive (in
        responsive-release, exit 0) checks progress never decreases and passes
        0.95, every frame < 50 ms, the cancel frame < 50 ms, and the worker
        exits within 1 s. My two re-runs: 11.0 s run, about 3710 frames, slowest
        4.3-9.0 ms; after Cancel the worker exited in 5.3-5.7 ms."
      truncated: false
  - id: A3
    source: brief.md
    text: "R3: Model/PDFium downloads show a Cancel button that stops the download
      and leaves no partial files; cancelling Extract Frames returns within one
      UI frame (< 50 ms)."
    result: passed
    reason:
      text: "Downloads for MobileSAM (Extract Object strip), OpenCLIP (Library panel)
        and PDFium (window) all have a Cancel button. Cancelling drops the
        Download, which sets the cancel flag; the worker then removes its .part
        file. Part names are now unique per download, so a restart cannot race
        the old cleanup. The MobileSAM test (local slow HTTP server) passes. I
        probed offline using a slowly fed FIFO as the download source: clicking
        PDFium Cancel took 0.3 ms and the .part file was removed; restart then
        cancel left no leftovers. The tagging model's 'Cancel Download' button
        shows in the Library panel and works, restart included. Extract Frames
        cancel no longer joins the worker: 0.10-0.11 ms including the next
        frame."
      truncated: false
  - id: A4
    source: brief.md
    text: "R4: `scripts/package-macos.sh` produces \"Game Asset Creator.app\", a
      .zip, and a .dmg. Every Mach-O file in the app references only system
      libraries or @rpath/@executable_path/@loader_path (no Homebrew or other
      absolute paths); the bundled ffmpeg reports an LGPL, decode-only
      configuration; `codesign --verify --deep --strict` passes; the bundled
      binary's `--self-test` passes (decodes the sample frame, loads the bundled
      ONNX Runtime) without touching the user's data. Launching the .app on
      another Mac is a manual check described in the README."
    result: passed
    reason:
      text: "The package check (scripts/package-macos.sh --skip-ffmpeg-build) passed
        with exit 0, and the binary was built after the last source edit. I
        inspected a copy of the bundle independently. otool: every Mach-O file
        references only /usr/lib, /System or @rpath; the executable has rpath
        @executable_path/../Frameworks; every @rpath library is bundled. The
        ffmpeg 7.1.5 configuration has --disable-gpl --disable-nonfree
        --disable-version3 --disable-encoders --disable-muxers
        --disable-network, and its licence reports 'LGPL version 2.1 or later'.
        codesign --verify --deep --strict passes (ad-hoc), and also on the app
        unpacked from the zip. Info.plist: io.github.game-asset-creator, 1.0.0,
        LSMinimumSystemVersion 13.0, NSHighResolutionCapable. I ran --self-test
        from the copy with an empty HOME and ORT_DISABLE_TELEMETRY unset: exit
        0; DYLD_PRINT_LIBRARIES shows only the bundle's ffmpeg and ONNX Runtime
        1.31.0 loaded (no Homebrew); HOME was still empty afterwards. A bad path
        exits 1 with a reason. The zip has 56 files; the dmg is UDZO and hdiutil
        verify passes. The README describes the manual clean-Mac check."
      truncated: false
  - id: A5
    source: brief.md
    text: "R5: README.md, docs/user-guide.md, and THIRD_PARTY_NOTICES.md exist; the
      guide's walkthrough uses only menu items and controls that exist in the
      app (checked by a test that finds each named menu item/button through the
      headless UI); model download sizes, sources, and storage paths match the
      code."
    result: passed
    reason:
      text: "README.md, docs/user-guide.md, THIRD_PARTY_NOTICES.md and LICENSE (MIT)
        exist. The guide test (every `Menu ▸ Command` in the guide and README
        found in the headless UI's menus) passes. Every bold control name in the
        docs exists as a UI string. Model sizes match the code: MobileSAM
        28,157,093 + 16,501,323 = 44.7 MB; CLIP 152,708,043 + 3,642,073 = 156.4
        MB; PDFium arm64 3,533,019 = 3.5 MB, now correct in both README and
        guide, matching the in-app {:.1} MB label. Sources match the code:
        Acly/MobileSAM, the onnx-community CLIP-ViT-B-32-laion2B repo, bblanchon
        pdfium-binaries chromium/7881. Storage paths match dirs::data_dir()/Game
        Asset Creator/{models, models/clip, pdfium, library}. Keyboard shortcuts
        match the KeyboardShortcut constants, and the video extensions match.
        The notices cover ffmpeg LGPL with source URL, SHA and flags, ONNX
        Runtime MIT, PDFium, MobileSAM Apache-2.0, and OpenCLIP MIT."
      truncated: false
  - id: A6
    source: brief.md
    text: "R6: tests/smoke.rs passes headlessly and offline via scripts/smoke.sh;
      .github/workflows/ci.yml is valid YAML on a macOS arm64 runner and runs
      exactly the commands that pass locally."
    result: passed
    reason:
      text: "tests/smoke.rs runs offline: GrabCut-only config, temporary library,
        tagging disabled by default. It covers image → filter → Remove
        Background → Auto-Detect → library → export PNG, save project, export
        assets; and video → Extract Assets → review → add → sprite sheet with
        atlas. The smoke check (scripts/smoke.sh) passed and my re-run passed.
        ci.yml parses as valid YAML: on push and pull_request, macos-14; brew
        ffmpeg@7 (7.1.5, keg-only) with PKG_CONFIG_PATH from brew --prefix
        ffmpeg@7; Rust pinned to 1.98.0 (the local toolchain); then fmt --check,
        clippy --all-targets -D warnings, cargo test, scripts/smoke.sh — the
        same commands as the passing Runtime checks. Tests that need models skip
        when the GAC_* variables are unset."
      truncated: false
  - id: A7
    source: brief.md
    text: "R7: All existing release benchmarks and UI tests pass unchanged."
    result: passed
    reason:
      text: "All 20 Runtime checks for this candidate passed with exit 0: cargo test
        (32 suites), clippy, fmt, every release benchmark (patterns, pattern-ui,
        filters, library, extract, video, canvas, transform, pdf, recolor,
        enhance) and the release UI suites (pdf_ui, recolor_ui, enhance_ui). No
        existing assertion was removed. Test changes only add
        wait_extraction_dialogs() after the now-asynchronous dialogs, and
        settle_canvas in the harness for the budgeted tile refresh. I reviewed
        the budgeted canvas refresh (128-row strips, 12 ms budget, small changes
        refreshed at once, pending tiles deferred) and the parallel
        composite/downsample. Mip boundary rows are recomputed by the next
        strip; the canvas level-equality test passes. The async dialog state
        machine looks consistent (see A1)."
      truncated: false
