  summary:
    text: "Round 2 (A1 and A5 fixes): Remove Background OK never renders on the UI
      thread - a finished preview is applied at once, otherwise the dialog shows
      Applying... and the step is recorded when the worker finishes (also with
      Preview off, which now renders on a worker when OK is clicked); the dialog
      shows a spinner + Working... while rendering; new release test
      remove_background_ok_never_blocks (OK mid-render and Preview off: frames
      21-33 ms, same pixels, one undo step). PDFium size in README/guide
      corrected to 3.5 MB. Also: download .part files are unique per download
      (no cancel/restart race), two misplaced doc comments fixed, CI pins
      ffmpeg@7 (PKG_CONFIG_PATH) and Rust 1.98.0. C16 release preparation
      (R1-R7). Perf: Remove Background renders on a worker (FilterRender
      snapshot Arc, generation-checked PreviewJob, OK reuses the finished
      preview, utility QoS), Auto-Detect keys+detects on a worker
      (poll/wait/busy; Add waits), Extract Frames cancel no longer joins,
      Extract Assets job exposes an exited flag, Cancel Download for
      MobileSAM/CLIP/PDFium. Profiling fixes: Layers panel computed a full Merge
      Down every frame to enable its button (now can_merge_down),
      Document::composite_region and canvas downsample_into run in parallel row
      bands, and the tile cache refreshes big changes in 128-row strips within a
      12 ms per-frame budget (tests settle the canvas). Packaging:
      scripts/package-macos.sh (LGPL decode-only ffmpeg 7.1.5 + ONNX Runtime
      1.31.0 pinned by SHA-256, @rpath Frameworks, ad-hoc sign, zip+dmg,
      otool/LGPL/codesign/--self-test checks with an empty HOME),
      src/selftest.rs + --self-test, ORT bundle search path and telemetry off
      (ORT_DISABLE_TELEMETRY set in main), icon (assets/icon,
      scripts/make-icon.sh). Docs: README.md, docs/user-guide.md,
      THIRD_PARTY_NOTICES.md, LICENSE; tests/guide.rs checks every Menu >
      Command in the docs exists. Smoke: tests/smoke.rs + scripts/smoke.sh;
      .github/workflows/ci.yml. Version 1.0.0; tests/fixtures/video/minute.mp4
      (walk.mp4 looped). (Runtime IDs A1-A7 = brief R1-R7.)"
    truncated: false
