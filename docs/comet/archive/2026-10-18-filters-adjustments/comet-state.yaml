acceptance:
  - id: A1
    source: brief.md
    text: "A1: Every filter is defined through the plugin API (id, name, category,
      parameter schema, apply) in its own file and registered in one registry;
      the Filter menu and dialogs are generated from the registry and schemas,
      so adding a filter needs only its file and a registry line."
    result: passed
    reason:
      text: src/filters/mod.rs defines the Filter trait (id, name, category, params
        schema, margin, pure apply) and one static 14-entry registry(); each
        filter has its own file under src/filters/; the Filter menu (ui.rs) and
        the dialog (filter_dialog.rs) iterate registry()/params() only;
        registry_ids_are_unique_and_schemas_valid passes.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: The Filter menu lists all 14 filters grouped Adjustments / Blur /
      Sharpen / Noise; filters with parameters open a preview dialog,
      Desaturate, Invert, and Sharpen apply immediately; items are disabled
      without a document or during a transform."
    result: passed
    reason:
      text: The Filter menu loops over Category::ALL with separators/headings in
        registry order; parameterless filters (Desaturate, Invert, Sharpen) have
        no '…' and go through apply_filter immediately; enabled only with a
        current document, no transform, and no open dialog;
        parameterless_filters_apply_immediately and
        menu_disabled_without_document_or_during_transform... pass.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: A preview dialog shows the filter's parameters (sliders, checkboxes,
      choices, seed, curve editor; grouped parameters follow their group
      selector), a Preview checkbox (default on), Reset, OK, and Cancel; the
      canvas shows the filtered result live after each change (the original when
      Preview is off); OK records one undo step named after the filter; Cancel
      restores the layer exactly."
    result: passed
    reason:
      text: filter_dialog::show draws schema widgets
        (slider/checkbox/choice/seed/curve editor), hides params outside the
        selected group, plus Preview (default true), Reset (keeps the seed),
        Cancel, OK; preview_filter writes the render or the 'before' snapshot;
        commit_filter records one PixelPatch named filter.name(); cancel
        restores. dialog_previews_live_ok_records_one_step,
        cancel_restores_exactly, grouped_parameters_per_channel_levels, and
        curve_editor_drag_brightens_midtones pass.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Filters apply to the active layer, or its mask when the mask is the
      edit target, through the selection: unselected pixels are unchanged and
      partially selected ones interpolated; undo/redo restore exactly."
    result: passed
    reason:
      text: "FilterSession targets open.paint_target() (pixels or mask) over
        editable_bounds; render_filter blends via blend_by_mask with selection
        coverage; PixelPatch stores before/after for exact undo/redo;
        filters_respect_selection_and_mask_target,
        render_filter_uses_context_and_selection, and
        filter_preview_commit_and_cancel pass. Repair (2): write_target_region
        and rgba_to_mask_value now use luminance_u8 (0.299/0.587/0.114, rounded,
        so gray stays exact); paint strokes already convert colors with
        paint::mask_gray (the same formula), so mask painting is unaffected;
        filtering_a_mask_writes_luminance passes."
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Color adjustments follow the spec formulas: Brightness/Contrast,
      Levels (RGB + per-channel), Curves (RGB + per-channel monotone cubic),
      Hue/Saturation/Lightness, Color Balance (tone ranges, preserve
      luminosity), Desaturate, Invert, Posterize — verified by unit tests on
      known values (e.g. Invert twice is identity, Posterize 2 yields only
      0/255, identity Levels/Curves change nothing)."
    result: passed
    reason:
      text: Brightness/Contrast, Levels (channel then master LUT), Curves
        (Fritsch-Carlson), HSL, Color Balance, Desaturate, Invert, and Posterize
        match the spec formulas I spot-checked; unit tests
        (invert_twice_is_identity, two_levels_are_black_and_white,
        identity_and_known_values, identity_monotone_and_through_points,
        tones_and_preserve_luminosity, etc.) pass.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: Gaussian Blur, Motion Blur, Sharpen, Unsharp Mask, Add Noise (seeded,
      uniform/gaussian, monochromatic), and Median follow the spec, blur in
      premultiplied alpha with edge clamping, and are deterministic — verified
      by unit tests (e.g. blur of a flat image is unchanged, median removes
      isolated specks, same seed gives same noise and a different seed different
      noise)."
    result: passed
    reason:
      text: "Premul + edge-clamped helpers; exact Gaussian below sigma 2, three-box
        above; motion blur, sharpen, unsharp, seeded noise, median, each with
        passing unit tests (flat blur unchanged, median removes specks and
        matches brute force, same/different seed). Repair (3): render_filter
        sets hidden _origin_x/_origin_y/_image_width after Params::clamp (clamp
        only touches schema keys, and the dialog's own Params never holds hidden
        keys); add_noise indexes (oy+y)*image_w+ox+x, which reduces to the old
        y*w+x without hidden params, so goldens are unchanged;
        noise_is_keyed_to_absolute_positions passes."
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: Previews update in under 100 ms on a 1920×1080 layer in a release
      build for every filter at default parameters and at the large settings in
      the spec (blur radius 50, motion distance 100, unsharp radius 50, median
      radius 10), measured by a release benchmark."
    result: passed
    reason:
      text: "cargo test --release --test filters -- --ignored --nocapture:
        bench_previews_1080p ok. Slowest: unsharp_mask large 37.52 ms, unsharp
        default 34.16, median large 30.47, motion large 29.46, gaussian large
        24.58; all under 100 ms."
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: Every filter has a golden-image regression test comparing a fixed
      synthetic input and fixed parameters byte-for-byte with a committed PNG in
      `tests/golden/` (regenerated with `UPDATE_GOLDEN=1`)."
    result: passed
    reason:
      text: tests/golden has 14 PNGs (one per filter id);
        every_filter_matches_its_golden_image compares bytes against
        render_filter output on a fixed synthetic 64x48 image (UPDATE_GOLDEN=1
        rewrites them), and goldens_differ_from_the_input guards against filters
        that do nothing; both pass.
      truncated: false
