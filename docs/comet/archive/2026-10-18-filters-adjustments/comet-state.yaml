  summary:
    text: "Repair iteration 2 (user-requested fixes on top of the verified
      candidate): (1) Save and Export refuse while a stroke, transform, or
      filter preview is live (OpenDocument::has_live_edit; AppState::save
      returns an error, export_current returns IoError::Encode, the dialog stays
      open). (2) Filter results written to a layer mask use luminance
      0.299R+0.587G+0.114B (undo::luminance_u8 in write_target_region and
      rgba_to_mask_value; gray input unchanged, so painting on masks is
      unaffected). (3) Add Noise keys its counter to absolute image coordinates:
      render_filter passes hidden params _origin_x/_origin_y/_image_width, so a
      pixel gets identical noise whatever the selection; goldens unchanged
      (origin 0 gives the old index). New tests:
      noise_is_keyed_to_absolute_positions,
      save_and_export_wait_for_the_filter_preview,
      filtering_a_mask_writes_luminance. New src/filters/: plugin API in mod.rs
      (Category, ParamKind Int/Float/Bool/Choice/Seed/Curve, ParamSpec with
      optional choice-selected group, Params with defaults/clamp, Filter trait
      id/name/category/params/margin/apply, registry() of 14 filters, find(),
      render_filter() that crops editable bounds plus the filter margin from the
      target snapshot, filters, and blends through the selection), shared
      helpers (row-parallel map, LUTs, premultiplied f32 buffers, exact Gaussian
      below sigma 2, three-box Gaussian above with all-horizontal passes +
      transpose, sparse tap convolution, splitmix64). One file per filter:
      brightness_contrast, levels (RGB+per channel groups), curves (RGB+per
      channel, Fritsch-Carlson monotone cubic LUT), hue_saturation (HSL),
      color_balance (tone groups, preserve luminosity), desaturate, invert,
      posterize, gaussian_blur, motion_blur (bilinear line kernel as merged
      integer taps), sharpen (3x3, alpha preserved), unsharp_mask, add_noise
      (seeded counter-based, uniform/gaussian, mono), median (per-channel
      sliding histogram, Huang). AppState filter session
      (begin/preview/commit/cancel/apply_filter; cancelled by
      undo/redo/execute/strokes/doc switch; counts as dirty; works on pixels or
      mask target; OK applies even with Preview off; one PixelPatch step
      labelled with the filter name). New src/filter_dialog.rs: schema-generated
      dialog (sliders, checkbox, choice buttons, seed with New, grouped params,
      draggable curve editor with add/remove/endpoints),
      Preview/Reset/OK/Cancel. UI: Filter menu grouped by category (params ->
      '…' dialog, parameterless apply immediately; disabled without document,
      during transform, or with a dialog open); dialog closes if its preview is
      cancelled elsewhere. Also reordered menus to File, Edit, Select, Layer,
      Filter, View (fixes the C5 order mismatch). Goldens in tests/golden/*.png
      (14) with UPDATE_GOLDEN=1 regeneration."
    truncated: false
  addressed_acceptance_ids:
