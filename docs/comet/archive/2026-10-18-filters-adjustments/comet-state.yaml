  summary:
    text: "All of A1-A8 pass. cargo fmt --check is clean, clippy --all-targets -D
      warnings is clean, cargo test passes in every suite, and the release
      preview benchmark's slowest case is 37.5 ms. All three repairs are
      implemented and tested: Save/Export are refused during a live edit with
      the dialog kept open, filter results on a mask are written as luminance
      (gray is exact), and Add Noise uses absolute coordinates with unchanged
      goldens. Only minor UX risks remain."
    truncated: false
  risks:
    - text: The A7 benchmark times render_filter only; it leaves out
        write_target_region and the canvas texture refresh that a real preview
        also pays (there is still about 60 ms of headroom).
      truncated: false
    - text: "Repair (1): the Export menu item and Ctrl+S are not disabled during a
        live preview. The native file dialog opens first and the error comes
        after the user picks a path. The export refusal reuses IoError::Encode,
        so the message reads as an encode error. The behaviour is correct:
        nothing is written and the dialog stays open
        (save_and_export_wait_for_the_filter_preview)."
      truncated: false
    - text: "Quit or Close with a filter dialog open: choosing Save in the prompt is
        refused because a live edit is in progress, and the prompt is dropped.
        Don't Save works."
      truncated: false
    - text: Undo while a filter dialog is open cancels the preview and also undoes the
        previous step, matching the existing stroke behaviour. The spec wording
        is ambiguous on this point.
      truncated: false
    - text: "Mask target: commit_filter compares RGBA after/before, so a colored
        result whose luminance equals the original records a no-op undo step
        (cosmetic only)."
      truncated: false
    - text: Golden PNGs are untracked, so 'goldens unchanged' by repair (3) is shown
        by reasoning plus the passing golden test, not by a git diff.
      truncated: false
