[package]
name = "game-asset-creator"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Desktop image editor for creating and extracting game assets"
license = "MIT"

[lib]
name = "game_asset_creator"
path = "src/lib.rs"

[[bin]]
name = "game-asset-creator"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui_dock = "0.21"
# Video decoding through the linked ffmpeg libraries (needs the ffmpeg
# development libraries, e.g. Homebrew `ffmpeg`).
ffmpeg-next = "8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
png = "0.18"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Same winit eframe uses; needed to turn off the default app menu (its Cmd+Q
# quits without asking about unsaved changes).
winit = "0.30"

[dev-dependencies]
tempfile = "3"
